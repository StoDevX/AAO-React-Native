[tools]
node = "24.15.0"
hk = "latest"
ruby = "3.4.9"
"gem:bundler" = "4.0.10"
"gem:fastlane" = "2.233.0"
cocoapods = "1.16.2"
"gem:rubocop" = "1.86.1"
sentry = "3.3.5"

[env]
_.path = ["node_modules/.bin"]
HK_PKL_BACKEND = "pklr"
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

# --- App commands ---

[tasks.ios]
description = "Run the iOS app"
run = "react-native run-ios"

[tasks.start]
description = "Start Metro bundler"
run = "react-native start"

[tasks."pod:install"]
description = "Install CocoaPods"
usage = '''
flag "--deployment" help="Disallow any changes to the Podfile or the Podfile.lock during installation"
flag "--repo-update" negate="--no-repo-update" help="Force running `pod repo update` before install"
flag "--verbose" help="Show more debugging information"
'''
dir = "{{ config_root }}/ios"
# The generated Podfile has no post_install hook calling apply-patches.sh, and
# .npmrc sets ignore-scripts=true so npm never runs `prepare` either. Without
# this the contrib patches silently stop being applied.
depends = ["prepare"]
run = '''
pod install {% if usage.deployment %}--deployment{% endif %} {% if usage.repo_update %}--repo-update{% endif %} {% if usage.verbose %}--verbose{% endif %}
'''

[tasks.prebuild]
description = "Generate the native iOS project from app.config.ts"
depends = ["prepare"]
# prebuild recreates ios/ from scratch, deleting the tracked ios/ci_scripts
# shim with it. `--no-clean` does not help: it preserves an existing *valid*
# project, but a fresh clone contains only ci_scripts, which prebuild treats as
# malformed and clears anyway. So stash the shim and put it back. Doing it here
# rather than in the script keeps every prebuild -- local, GitHub Actions,
# Xcode Cloud -- leaving the same tree.
run = '''
shim="$(mktemp -d)"
if [ -d ios/ci_scripts ]; then
  cp -R ios/ci_scripts/. "$shim/"
else
  echo "warning: ios/ci_scripts is missing, so there is nothing to preserve." >&2
  echo "         Xcode Cloud will not run any build script without it." >&2
  echo "         Restore it with: jj restore ios/ci_scripts" >&2
fi

expo prebuild --platform ios

if [ -n "$(ls -A "$shim" 2>/dev/null)" ]; then
  mkdir -p ios/ci_scripts
  cp -R "$shim/." ios/ci_scripts/
fi
rm -rf "$shim"
'''

[tasks.fastlane]
description = "Run fastlane"
run = "fastlane"

# --- Code quality ---

[tasks.lint]
description = "Run ESLint"
run = "eslint --report-unused-disable-directives --max-warnings=0 --cache source/ modules/ scripts/ images/ plugins/"
depends = ["prepare"]

[tasks.pretty]
description = "Format code with Prettier"
run = "prettier --write ."

[tasks."pretty:check"]
description = "Check code formatting"
run = "prettier --check ."

[tasks.p]
description = "Format staged files with pretty-quick"
run = "pretty-quick"

[tasks.tsc]
description = "Run TypeScript compiler"
run = "tsc --noEmit"
# source/views/faqs/local-faqs.ts imports docs/faqs.json, which bundle-data
# generates, so tsc cannot run against a clean checkout without it.
depends = ["prepare", "bundle-data"]

[tasks.test]
description = "Run Jest tests"
run = "jest"
depends = ["prepare"]

[tasks.prepare]
description = "Apply patches"
run = "scripts/apply-patches.sh"

# --- Data ---

[tasks."bundle-data"]
description = "Bundle data files"
run = "node scripts/bundle-data.mjs data/ docs/"

[tasks."validate-bus-data"]
description = "Validate bus schedule data"
run = "node scripts/validate-bus-schedules.mjs"

[tasks."validate-data"]
description = "Validate data files"
run = "node scripts/validate-data.mjs"

[tasks."compress-data"]
description = "Compress data files"
run = "gzip --keep docs/*.json"

# --- Bundles ---

[tasks."bundle:ios"]
description = "Generate iOS JS bundle"
run = """
react-native bundle \
  --entry-file index.js \
  --dev false \
  --platform ios \
  --bundle-output ./ios/AllAboutOlaf/main.jsbundle \
  --sourcemap-output ./ios/AllAboutOlaf/main.jsbundle.map \
  --assets-dest ./ios
"""

# --- Agent tasks ---

[tasks."agent:setup"]
description = "Set up the development environment for AI agents"
run = """
npm ci
mise run prepare
mise run bundle-data
"""

[tasks."agent:pre-commit"]
description = "Run pre-commit checks: format, lint, typecheck, test"
depends = ["pretty", "lint", "tsc", "test"]

# --- Diagnostics (from Makefile) ---

[tasks.tsc-errors]
description = "Generate TypeScript error report"
run = 'tsc 2>&1 | sed "s:$(git rev-parse --show-toplevel):.:g" | tee tsc-errors || true'

[tasks.tsc-counts]
description = "Count TypeScript errors by code"
depends = ["tsc-errors"]
run = "cat tsc-errors | rg -or '$1' 'error \\b(TS\\d+)\\b' | sort | uniq -c | sort -nr | sed 's/^ *//' | tee tsc-counts || true"

[tasks.eslint-problems]
description = "Generate ESLint problem report"
run = 'mise run lint 2>&1 | sed "s:$(git rev-parse --show-toplevel):.:g" | tee eslint-problems || true'

[tasks.files]
description = "Generate all diagnostic reports"
depends = ["tsc-errors", "tsc-counts", "eslint-problems"]

[tasks.verify]
description = "Verify no diagnostic changes"
depends = ["files"]
run = "git diff --exit-code"
