# Generates DataEditor.xcodeproj: run `mise run xcodegen` from the repo root.
# The project is gitignored, so change targets and build settings here.
name: DataEditor

options:
  xcodeVersion: '2700'
  projectFormat: xcode16_0
  defaultSourceDirectoryType: syncedFolder
  # Every build setting is written out below, as the hand-made project had them.
  settingPresets: none

packages:
  DataEditorKit:
    path: DataEditorKit

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ARCHS: arm64
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++14
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    CODE_SIGN_STYLE: Automatic
    COPY_PHASE_STRIP: NO
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: NFMTHAZVS9
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_C_LANGUAGE_STANDARD: gnu11
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    MARKETING_VERSION: '1.0'
    MTL_FAST_MATH: YES
    PRODUCT_NAME: $(TARGET_NAME)
    SDKROOT: macosx
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_VERSION: '6.0'
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ['$(inherited)', 'DEBUG=1']
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      ONLY_ACTIVE_ARCH: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  DataEditor:
    type: application
    platform: macOS
    sources:
      - path: DataEditor
        excludes:
          - DataEditor.entitlements
          - Info.plist
    dependencies:
      - package: DataEditorKit
    # oxfmt, and the Node and ccc-server the preview downloads, from
    # `mise run data-editor:runtime`. Every build stops without them: an app
    # without oxfmt opens, then fails the first time it saves a file.
    # oxfmt goes in Contents/Helpers, signed as the app is with the hardened
    # runtime: notarization refuses code among the resources, or code
    # oxfmt's release signed only ad hoc. Xcode signs the app itself after this.
    postBuildScripts:
      - name: Embed Runtime
        inputFiles: ['$(SRCROOT)/build/runtime/oxfmt']
        outputFiles: ['$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/oxfmt']
        script: |
          set -euo pipefail
          runtime="$SRCROOT/build/runtime"
          if [ ! -x "$runtime/oxfmt" ]; then
            echo "error: run \`mise run data-editor:runtime\` first" >&2
            exit 1
          fi
          rsync -a --delete --exclude oxfmt "$runtime/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Runtime/"
          helpers="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          cp "$runtime/oxfmt" "$helpers/oxfmt"
          codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$helpers/oxfmt"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: DataEditor/DataEditor.entitlements
        COMBINE_HIDPI_IMAGES: YES
        # The GitHub OAuth App's client ID, which Info.plist hands to the app.
        # It names the app to GitHub and is not a secret.
        DATA_EDITOR_GITHUB_CLIENT_ID: Ov23lilOuUmLuFDWskKz
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: DataEditor/Info.plist
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/../Frameworks']
        PRODUCT_BUNDLE_IDENTIFIER: com.drewvolz.allaboutolaf-data-editor
        SDKROOT: macosx
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  DataEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DataEditorTests
    dependencies:
      - target: DataEditor
      - package: DataEditorKit
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          ['$(inherited)', '@executable_path/../Frameworks', '@loader_path/../Frameworks']
        PRODUCT_BUNDLE_IDENTIFIER: com.drewvolz.allaboutolaf-data-editorTests
        SDKROOT: macosx
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DataEditor.app/Contents/MacOS/DataEditor

  DataEditorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: DataEditorUITests
    dependencies:
      - target: DataEditor
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          ['$(inherited)', '@executable_path/../Frameworks', '@loader_path/../Frameworks']
        PRODUCT_BUNDLE_IDENTIFIER: com.drewvolz.allaboutolaf-data-editorUITests
        SDKROOT: macosx
        TEST_TARGET_NAME: DataEditor

schemes:
  DataEditor:
    build:
      targets:
        DataEditor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DataEditorTests
          parallelizable: false
        - name: DataEditorUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
