# The Mac radio's Xcode project. `mise run xcodegen` writes Radio.xcodeproj
# from this file; the .xcodeproj is not committed.
name: Radio
options:
  # Every build setting is spelled out below, so xcodegen adds none of its own.
  settingPresets: none
  xcodeVersion: '14.3'
  developmentLanguage: en
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++14
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    CODE_SIGN_STYLE: Automatic
    COPY_PHASE_STRIP: NO
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: NFMTHAZVS9
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_C_LANGUAGE_STANDARD: gnu11
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    MARKETING_VERSION: '1.0'
    MTL_FAST_MATH: YES
    PRODUCT_NAME: $(TARGET_NAME)
    SDKROOT: macosx
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_VERSION: '5.0'
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - DEBUG=1
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  Radio:
    type: application
    platform: macOS
    sources:
      - path: Radio
      # The station list the app falls back on before it has fetched the
      # sources manifest; the React Native app bundles the same file.
      - path: ../../modules/data-sources/bundled.json
        group: Radio
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
        PRODUCT_BUNDLE_IDENTIFIER: com.drewvolz.allaboutanything-radio
        SDKROOT: macosx
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  RadioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RadioTests
    dependencies:
      - target: Radio
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
          - '@loader_path/../Frameworks'
        PRODUCT_BUNDLE_IDENTIFIER: com.drewvolz.allaboutanything-radioTests
        SDKROOT: macosx
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Radio.app/Contents/MacOS/Radio
  RadioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: RadioUITests
    dependencies:
      - target: Radio
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/Frameworks'
          - '@loader_path/Frameworks'
        PRODUCT_BUNDLE_IDENTIFIER: com.drewvolz.allaboutanything-radioUITests
        SDKROOT: macosx
        TEST_TARGET_NAME: Radio
schemes:
  Radio:
    build:
      targets:
        Radio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RadioTests
        - RadioUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
