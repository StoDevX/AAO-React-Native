# Synthetic contract examples, not verified campus operating policies.
- name: Example office
  category: Offices
  kind: office
  schedule:
    - title: Hours
      hours:
        - {days: [Mo, Tu, We, Th, Fr], from: '8:00am', to: '6:00pm'}
  exceptions:
    - date: '2026-10-10'
      schedule:
        - title: By appointment
          notes: Call before visiting.
          hours: []
  breakSchedule:
    fall: inherit
    winter: normal
    spring: office-hours
    easter: spring
    interim:
      schedule:
        - title: Hours
          hours:
            - {days: [Mo], from: '10:00am', to: '2:00pm'}
      exceptions:
        - date: '2027-01-30'
          schedule:
            - title: Closed
              isPhysicallyOpen: false
              hours: []
- name: Example building
  category: Buildings
  kind: building
  schedule:
    - title: Hours
      hours:
        - {days: [Mo, Tu, We, Th, Fr, Sa, Su], from: '7:00am', to: '11:00pm'}
  breakSchedule:
    fall:
      - title: Reduced hours
        hours:
          - {days: [Mo, Tu, We, Th, Fr, Sa, Su], from: '10:00am', to: '5:00pm'}
    winter: inherit
    interim: closed
