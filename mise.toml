[tools]
node = "24.21.0"
pnpm = "12.9.0"
hk = "2.5.0"
shellcheck = "0.11.0"
zizmor = "1.30.1"
ruby = "3.4.11"
"gem:bundler" = "4.0.22"
"npm:@changesets/cli" = "3.0.3"
"npm:source-map-explorer" = "2.5.3"

# Taps and types on a simulator, which simctl cannot do -- see the
# run-on-simulator skill. macOS only: it drives CoreSimulator, so it has
# nothing to talk to on the Linux jobs.
[tools."github:cameroncooke/AXe"]
version = "1.8.0"
exe = "axe"
extract_all = "true"
os = ["macos"]
# The release tarball is unsigned, and macOS kills an unsigned arm64 binary on
# exec -- SIGKILL, exit 137, no message. The homebrew formula ad-hoc signs it
# after unpacking; this is the same step.
postinstall = """
for framework in "$MISE_TOOL_INSTALL_PATH"/Frameworks/*.framework; do
	codesign --force --sign - --timestamp=none "$framework"
done
codesign --force --sign - --timestamp=none "$MISE_TOOL_INSTALL_PATH/axe"
"""

# Sentry's Xcode build phases upload source maps and dSYMs with this, found
# through SENTRY_CLI_EXECUTABLE, rather than the npm @sentry/cli that
# pnpm-workspace.yaml drops. Pinned to the version @sentry/react-native pins.
# macOS only: only an Xcode archive uploads, so the Linux jobs never need it.
[tools.sentry]
version = "3.8.0"
os = ["macos"]

# Shrinks the icon previews `mise run icons` renders. macOS only, as ictool is.
[tools.oxipng]
version = "10.2.1"
os = ["macos"]

[env]
_.path = ["node_modules/.bin"]
HK_PKL_BACKEND = "pklr"
HK_MISE = "1"

# The names of the devices and simulators Xcode knows, for completing a device.
[vars]
device_names = "xcrun devicectl list devices --omit-deprecated-fields-in-json --json-output=- 2>/dev/null | jq --raw-output '.result.devices[].properties.state.name'"

[hooks]
postinstall = "hk install --mise"

# --- General commands ---
[tasks."pnpm:install:frozen"]
description = "install pnpm dependencies"
run = "pnpm install --frozen-lockfile"

# --- App commands ---

# Flags for expo go after `--`: mise run ios "iPhone 17e" -- --scheme Foo
[tasks.ios]
description = "Run the iOS app"
usage = '''
  arg "[device]" help="The device to run on" default="" env="DEVICE"
  complete "device" run=#"{{ vars.device_names }}"#
  arg "[args]..." var=#true double_dash="required" help="Passed to expo run:ios"
'''
run = '''
eval "set -- $usage_args"
expo run:ios ${usage_device:+--device "$usage_device"} "$@"
'''

[tasks.start]
description = "Start Metro bundler"
run = "expo start"

# ccc-server runs in the background so Metro keeps the terminal, and with it the
# keys that reload the app and open the debugger; under `depends` both would
# lose the TTY. The server advertises itself over mDNS, so a device finds it in
# Settings -> Server URL. It runs in its own process group (`set -m`) so the
# trap can stop mise and the server it spawned together; Ctrl-C then reaches
# only Metro, and the trap stops the server. ccc-server is looked for beside
# the main checkout, which a linked worktree is not: git's common directory
# is the main checkout's .git for a clone and a worktree alike.
[tasks."start:with-server"]
description = "Start ccc-server for St. Olaf and Metro together"
run = '''
#!/usr/bin/env bash
if test -z "${CCC_SERVER_DIR:-}"; then
  main_checkout="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
  CCC_SERVER_DIR="$main_checkout/../ccc-server"
fi
if test ! -f "$CCC_SERVER_DIR/.config/mise.toml"; then
  echo "error: no ccc-server checkout at $CCC_SERVER_DIR; set CCC_SERVER_DIR" >&2
  exit 1
fi

set -m
mise --cd "$CCC_SERVER_DIR" run stolaf-college:mdns &
server=$!
trap 'kill -- -"$server" 2>/dev/null' EXIT

expo start
'''

[tasks.prebuild]
description = "Generate the native iOS project from app.config.ts"
wait_for = ["pnpm:install:*"]
# CocoaPods requires a UTF-8 locale; without one `pod install` crashes with
# an Encoding::CompatibilityError. A shell with no LANG set, such as an
# agent's, has none.
env = { LANG = "en_US.UTF-8" }
# prebuild recreates ios/ from scratch, deleting the tracked ios/ci_scripts
# shim with it. `--no-clean` does not help: it preserves an existing *valid*
# project, but a fresh clone contains only ci_scripts, which prebuild treats as
# malformed and clears anyway. So stash the shim and put it back. Doing it here
# rather than in the script keeps every prebuild -- local, GitHub Actions,
# Xcode Cloud -- leaving the same tree.
run = '''
set -e

if test ! -d ios/ci_scripts; then
  echo "error: ios/ci_scripts is missing, so there is nothing to preserve." >&2
  echo "       Xcode Cloud finds build scripts only beside the .xcworkspace," >&2
  echo "       so without it no Xcode Cloud build runs a script at all." >&2
  echo "       Restore it with: jj restore ios/ci_scripts" >&2
  exit 1
fi

shim="$(mktemp -d)"
cp -R ios/ci_scripts/. "$shim/"

# CocoaPods comes from the Gemfile, so that its json pin applies -- see the
# comment there. Expo runs `bundle exec pod` only once `bundle exec pod
# --version` answers, so the gems have to be in place before prebuild.
bundle install --quiet

expo prebuild --platform ios

mkdir -p ios/ci_scripts
cp -R "$shim/." ios/ci_scripts/
rm -rf "$shim"

if test ! -f ios/ci_scripts/ci_post_clone.sh; then
  echo "error: ios/ci_scripts was not restored after prebuild." >&2
  exit 1
fi
'''

[tasks."build:ios"]
description = "Build the app with xcodebuild for iOS"
wait_for = ["prebuild"]
usage = '''
  arg "<device>" help="The device to build for" default="simulator" env="DEVICE"
'''
run = '''
xcodebuild build \
  -workspace ios/AllAboutOlaf.xcworkspace \
  -scheme AllAboutOlaf \
  -configuration Debug \
  -destination "platform=iOS,name=${usage_device?}" \
  -derivedDataPath ios/build \
  -allowProvisioningUpdates \
  CODE_SIGN_STYLE=Automatic \
  DEVELOPMENT_TEAM=TMK6S7TPX2 \
  PROVISIONING_PROFILE_SPECIFIER=""
'''

[tasks."embed-jsbundle:ios"]
hide = true
description = "Embed the .jsbundle into the ios app package"
wait_for = ["bundle:ios", "build:ios"]
env.APP = "ios/build/Build/Products/Debug-iphoneos/AllAboutOlaf.app"
run = [
	'''cp ios/AllAboutOlaf/main.jsbundle "$APP/"''',
	'''rm -rf "$APP/assets" && cp -R ios/assets "$APP/"''',
]

[tasks."device:find-udid"]
hide = true
description = "Find the UDID of a device, or exit 1 if no device found"
usage = '''
  arg "<device>" help="The device to build for" default="simulator" env="DEVICE"
'''
run = '''
  xcrun devicectl list devices --filter "Name = '${usage_device?}'" --omit-deprecated-fields-in-json --json-output=- 2>/dev/null | jq --raw-output --exit-status .result.devices[0].properties.hardware.udid
'''

[tasks."device:deploy"]
hide = true
description = "Deploy the app to a physical device"
usage = '''
  arg "<device>" help="The device to target" default="simulator" env="DEVICE"
'''
env.APP = "ios/build/Build/Products/Debug-iphoneos/AllAboutOlaf.app"
run = '''
  xcrun devicectl device install app --device "$(mise run device:find-udid "${usage_device?}")" "$APP"
'''

[tasks.device]
description = "Build and deploy the app to a physical device"
usage = '''
  arg "<device>" help="The device to build for" default="simulator" env="DEVICE"
  complete "device" run=#"{{ vars.device_names }}"#
'''
depends = [
	{ task = "pnpm:install:frozen" },
	{ task = "prebuild", env.APP_VARIANT = "development" },
	{ task = 'build:ios', args = [
		"{{usage.device}}",
	] },
	{ task = "bundle:ios" },
	{ task = "embed-jsbundle:ios" },
]
run = [{ task = 'device:deploy', args = ["{{usage.device}}"] }]

[tasks."device:metro"]
description = "Build and deploy a Debug app that loads its JavaScript from Metro, not from the app"
usage = '''
  arg "<device>" help="The device to build for" default="simulator" env="DEVICE"
  complete "device" run=#"{{ vars.device_names }}"#
'''
env.APP = "ios/build/Build/Products/Debug-iphoneos/AllAboutOlaf.app"
depends = [
	{ task = "pnpm:install:frozen" },
	{ task = "prebuild", env.APP_VARIANT = "development" },
	{ task = 'build:ios', args = [
		"{{usage.device}}",
	] },
]
# A bundle left in the app by `mise run device` would win over Metro, which
# `AppDelegate.bundleURL()` only asks when the app holds none.
run = [
	'''rm -f "$APP/main.jsbundle" && rm -rf "$APP/assets"''',
	{ task = 'device:deploy', args = [
		"{{usage.device}}",
	] },
]

# --- Code quality ---

# mise runs a task's dependencies in parallel.
[tasks.lint]
description = "Run oxlint, shellcheck and zizmor"
depends = ["lint:oxlint", "lint:shell", "lint:actions"]

[tasks."lint:oxlint"]
description = "Run oxlint"
run = "oxlint app/ source/ modules/ scripts/ images/ plugins/"

[tasks."lint:shell"]
description = "Run shellcheck on the shell scripts"
run = "git ls-files -z '*.sh' | xargs -0 shellcheck"

# zizmor's online audits (impostor commits, known-vulnerable actions) need a
# GitHub token; without one it runs the offline audits only.
[tasks."lint:actions"]
description = "Run zizmor on the GitHub Actions workflows"
run = '''
if test -n "${GH_TOKEN:-}${GITHUB_TOKEN:-}"; then
  zizmor --no-progress .github/workflows
else
  env -u GH_TOKEN -u GITHUB_TOKEN zizmor --offline --no-progress .github/workflows
fi
'''

[tasks.format]
description = "Format code with oxfmt"
run = "oxfmt --write ."

[tasks."format:check"]
description = "Check code formatting"
run = "oxfmt --check ."

[tasks.tsc]
description = "Run TypeScript compiler"
# source/features/faqs/local-faqs.ts imports docs/faqs.json, which bundle-data
# generates, so tsc cannot run against a clean checkout without it.
depends = ["bundle-data"]
run = "tsc --noEmit"

[tasks.changeset]
description = "Add a changeset: a line for the release notes and how big a bump it is"
run = "changeset"

[tasks.test]
description = "Run every test"
depends = ["test:jest", "test:node"]

[tasks."test:jest"]
description = "Run the Jest tests"
# Same reason as tsc above: source/features/building-hours/query.ts imports
# docs/building-hours.json, which bundle-data generates, so the suite cannot
# run against a clean checkout without it. node:test needs none of it, so the
# dependency sits here rather than on the umbrella.
depends = ["bundle-data"]
run = "jest"

# scripts/ and plugins/ are plain Node with no React Native in them, so their
# tests run on node:test: native ESM, no transform step, and no restriction on
# import.meta -- a literal import.meta breaks Jest's CommonJS transform of an
# .mjs file, which is why scripts/report-flaky-uitests.mjs checks its entry
# point by argv instead. Jest's testMatch requires a __tests__/ segment, so a
# test sitting beside its subject cannot end up running under both runners.
#
# node --test wants a quoted glob here; a bare directory argument makes it try
# to load the directory as a module.
#
# The plugin tests import .ts, which Node strips types from and then loads as
# ESM. Every file under plugins/ warns that it had to be reparsed, because the
# root package.json has no `type` and cannot gain one -- the app is CommonJS.
# The warning says nothing actionable, so it is off rather than in the output
# of every run.
[tasks."test:node"]
description = "Run the node:test tests beside their subjects"
env = { TZ = "America/Chicago" }
run = 'node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test "scripts/*.test.mjs" "scripts/pr-report/*.test.mjs" "plugins/*.test.ts" "source/database/*.test.ts" "source/database/calendar/*.test.ts" "source/database/search/*.test.ts" "source/database/courses/*.test.ts" "modules/event-list/*.test.ts" "modules/ccc-calendar/*.test.ts" "modules/schedules/*.test.ts"'

# --- Data ---

[tasks."bundle-data"]
description = "Bundle data files"
wait_for = ["pnpm:install:*"]
run = "node scripts/bundle-data.mjs data/ docs/"

[tasks.images]
description = "Convert images/<group>/source/ originals to the WebP files the app fetches"
run = "node scripts/make-images.mjs"

[tasks."refresh-bus-data"]
description = "Regenerate data/bus-times/ from the Hiawathaland GTFS feed"
run = "node scripts/refresh-bus-data.mjs"

[tasks."validate-bus-data"]
description = "Validate bus schedule data"
run = "node scripts/validate-bus-schedules.mjs"

[tasks."validate-data"]
description = "Validate data files"
run = "node scripts/validate-data.mjs"

[tasks."scrape-dining"]
description = "Update data/building-hours/ from Bon Appétit's café pages"
run = "node scripts/scrape-bonapp.mjs"

[tasks.icons]
description = "Render the in-app icon previews from assets/*.icon, and the Retro app icon set"
run = "node scripts/make-icons.mjs"

[tasks."crt-pixels"]
description = "Redraw the Old Main CRT icon's pixel layer from its SVG"
run = "node scripts/make-crt-pixels.mjs"

[tasks."trace-symbol"]
description = "Trace a logo into a custom SF Symbol in assets/symbols/"
run = "node scripts/trace-symbol.mjs"

# Needs the network, so it stays out of validate-data, as scrape-dining does.
[tasks."update-map-fixtures"]
description = "Replace the map fixtures the UI tests read with each campus's live map"
run = "node scripts/update-map-fixtures.mjs"

[tasks."update-mess-fixtures"]
description = "Re-record Olaf Messenger's UI-test fixtures from a run of its UI tests"
run = "node scripts/update-mess-fixtures.mjs"

[tasks."chaos-routes"]
description = "Regenerate the list of routes the chaos monkey opens"
run = "node scripts/chaos-routes.mjs"

# These tasks have no usage spec, so mise appends their arguments to the
# command and scripts/chaos.mjs parses them; mise reads a flag it knows, such as
# --help, itself, so that one needs `--` first. A replay takes its step budget
# from its recording, which no default here may override.
[tasks.chaos]
description = "Drive the app at random with network faults on a booted simulator"
run = "node scripts/chaos.mjs"

# TEST_RUNNER_ names the Metro to the test, since `xcodebuild` passes it only
# prefixed variables.
[tasks."chaos:8081"]
description = "Run chaos against the Metro on localhost:8081"
env = { TEST_RUNNER_AAO_JS_LOCATION = "localhost:8081" }
run = "node scripts/chaos.mjs"

[tasks."chaos:bundled"]
description = "Run chaos on a build with its JavaScript embedded, so no Metro is needed"
depends = ["bundle:ios"]
run = "node scripts/chaos.mjs --bundled"

[tasks."scrape-student-wages"]
description = "Update data/student-wages.yaml from St. Olaf's compensation page"
run = "node scripts/scrape-student-wages.mjs"

[tasks."scrape-ksto-schedule"]
description = "Update data/ksto-schedule.yaml from KSTO's Now Playing post"
run = "node scripts/scrape-ksto-schedule.mjs"

# Needs the network -- it fetches the live campus geojson -- so it stays out
# of validate-data, which gates three workflows including deploy-data. A
# ccc-server blip should not block an unrelated pull request from merging.
[tasks."validate-building-keys"]
description = "Check that every building: key resolves to a real map feature"
run = "node scripts/validate-building-keys.mjs"

# Needs the network too: it runs every area's search against the live board.
[tasks."check-student-work-areas"]
description = "Report Student Work postings that no area tile holds"
run = "node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-student-work-areas.mjs"

# An undeclared dependency -- or an orphaned @frogpond one -- resolves fine
# locally through the root node_modules, so format, lint, tsc and test all
# pass and CI is the first thing to say otherwise. Same reasoning as
# validate-lockfile below: cheap here, a red pipeline anywhere else.
[tasks."validate-deps"]
description = "Check that modules declare the packages they import"
run = "node scripts/validate-workspace-deps.mjs"

# A package.json edited without regenerating the lockfile passes format, lint,
# tsc and test -- node_modules is already installed locally -- and then fails
# every CI job at install.
#
# `--lockfile-only` resolves without touching node_modules, and
# `trust-lockfile` skips pnpm's supply-chain re-verification, which reaches
# the registry and takes over a minute on a cold cache. It is set through
# `--config.` because pnpm 12.6's install rejects the `--trust-lockfile` flag
# its own help lists. That check belongs in
# CI, where the network is a given; here the question is only whether the
# lockfile still describes the package.json files.
# metro-config is a direct dependency pinned exactly while metro itself is
# only ever transitive and floats, so the two drift apart and the install ends
# up carrying two copies of every metro package. Nothing fails when it happens,
# which is why it needs checking.
[tasks."validate-single-copy"]
description = "Check that watched packages resolve to one version in the lockfile"
run = "node scripts/validate-single-copy.mjs"

# Renovate has no Expo datasource, so it only ever offers the newest release
# and will walk a package past the range this SDK was tested against. The
# ceilings it needs come from the installed SDK's own list, which changes only
# when package.json does -- so they are generated and committed here, the same
# way bundle-data commits bundled.json, rather than by a job on a timer.
[tasks."bundle-renovate-expo"]
description = "Write Renovate a version ceiling per package the Expo SDK pins"
wait_for = ["pnpm:install:*"]
# oxfmt has opinions about JSON that JSON.stringify does not share -- it packs
# a short array onto one line. Formatting here means the committed file is
# byte-for-byte what CI regenerates, so `git diff --exit-code` means something.
run = ["node scripts/bundle-renovate-expo.mjs", "oxfmt --write renovate.json"]

# react and react-native are named once, in the catalog, because every module
# declares them as peers and autoInstallPeers turns each declaration into a
# real install -- so one manifest naming its own version is enough to leave two
# runtimes in the tree. This reads no network, unlike validate-expo-versions,
# so it runs locally as well as in CI.
[tasks."validate-catalog-refs"]
description = "Check that nothing pins a version the catalog owns"
run = "node scripts/validate-catalog-refs.mjs"

# Expo builds and tests each SDK against one version of every package it knows
# about. Drifting off that list breaks nothing here -- the bundle builds, the
# tests pass -- and turns up as a native crash on a device.
#
# The list comes from the expo package we have installed, not from Expo's
# versions API. An API-backed check turns red when Expo publishes, which means
# master breaking with no commit behind it and a demand to move onto versions
# the SDK we run has never been tested against.
[tasks."validate-expo-versions"]
description = "Check that packages match the versions Expo recommends"
run = "node scripts/validate-expo-versions.mjs"

[tasks."validate-lockfile"]
description = "Check that pnpm-lock.yaml matches the package.json files"
run = "pnpm install --frozen-lockfile --lockfile-only --config.trust-lockfile=true"

# CI keys its toolchain cache on mise.lock alone, so a lock that has drifted
# from mise.toml would otherwise restore a cache that satisfies neither. The
# dry run resolves every tool against the lock without installing anything:
# it exits 1 for a tool the lock does not name, or a version it names
# differently, and 0 when they agree -- whether or not the tools are present.
# Only the project's tools are held to the lock: a tool in a contributor's own
# ~/.config/mise/config.toml can never be in it.
[tasks."validate-mise-lock"]
description = "Check that mise.lock matches mise.toml"
env = { MISE_LOCKED_SCOPES = "project" }
run = "mise install --locked --dry-run"

[tasks."compress-data"]
description = "Compress data files"
run = "gzip --keep docs/*.json"

# --- Bundles ---

[tasks."bundle:ios"]
description = "Generate iOS JS bundle"
depends = ["bundle-data"]
wait_for = ["prebuild"]
# Keeps the UI-test fixtures a release bundle drops (metro.config.js): this bundle
# serves the UI tests, and `mise run device` builds, which carry them unused.
env = { KEEP_UITEST_FIXTURES = "1", EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH = "1", EXPO_UNSTABLE_TREE_SHAKING = "1" }
# --reset-cache: Metro caches in $TMPDIR, which neither a pnpm install nor
# deleting ios/ clears, so a bundle can embed a package copy pnpm has replaced.
run = """
expo export:embed \
  --reset-cache \
  --entry-file index.js \
  --dev false \
  --platform ios \
  --bundle-output ./ios/AllAboutOlaf/main.jsbundle \
  --sourcemap-output ./ios/AllAboutOlaf/main.jsbundle.map \
  --assets-dest ./ios
"""

# Measures what ships: no UI-test fixtures and no mocked mode, unlike
# bundle:ios, and the same hermesc flags as Xcode's Release build.
#
# Bundles twice. The unminified bundle is what a Release build ships
# (expo/scripts/react-native-xcode.sh passes --minify false whenever Hermes
# is on), so hermesc compiles it for the bytecode figure the headline and
# gate use. Its own source map is mostly unattributable, though: indentation
# and line endings are not worth minifying away, so source-map-explorer puts
# several megabytes of them in [unmapped]/[EOLs], which no package or
# feature owns. A minified copy's [unmapped] is Metro's module wrappers
# instead, so the per-package and per-feature tables are built from the
# minified bundle's source map.
[tasks."size-report"]
description = "Measure the production JS bundle for the PR report"
depends = ["bundle-data"]
# The same tree shaking as the Release build (plugins/with-tree-shaking.ts).
env = { EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH = "1", EXPO_UNSTABLE_TREE_SHAKING = "1" }
run = """
set -euo pipefail
out=size-report
rm -rf "$out" && mkdir -p "$out"
expo export:embed \
  --reset-cache \
  --entry-file index.js \
  --dev false \
  --minify false \
  --platform ios \
  --bundle-output "$out/main.jsbundle" \
  --sourcemap-output "$out/main.jsbundle.map" \
  --assets-dest "$out/assets"
expo export:embed \
  --reset-cache \
  --entry-file index.js \
  --dev false \
  --platform ios \
  --bundle-output "$out/minified/main.jsbundle" \
  --sourcemap-output "$out/minified/main.jsbundle.map" \
  --assets-dest "$out/minified/assets"
hermes=$(node -p "require('path').dirname(require.resolve('hermes-compiler/package.json', {paths: [require('path').dirname(require.resolve('react-native/package.json'))]}))")
case "$(uname -s)" in
  Darwin) bin="$hermes/hermesc/osx-bin/hermesc" ;;
  *) bin="$hermes/hermesc/linux64-bin/hermesc" ;;
esac
"$bin" -emit-binary -max-diagnostic-width=80 -O -out "$out/main.hbc" "$out/main.jsbundle" 2>"$out/hermesc.log" || { cat "$out/hermesc.log" >&2; exit 1; }
source-map-explorer "$out/minified/main.jsbundle" "$out/minified/main.jsbundle.map" --json --no-border-checks --no-root > "$out/explorer.json"
node scripts/pr-report/js-size.mjs "$out"
"""

[tasks."app-size"]
description = "Archive the native app without its JS bundle and measure it for the PR report"
# The JS bundle and its images are measured by size-report, on Linux.
env = { SKIP_BUNDLING = "1", SENTRY_DISABLE_AUTO_UPLOAD = "true" }
run = """
set -euo pipefail
out=app-size
rm -rf "$out" && mkdir -p "$out"
mise run prebuild
NSUnbufferedIO=YES xcodebuild archive \
  -workspace ios/AllAboutOlaf.xcworkspace \
  -scheme AllAboutOlaf \
  -configuration Release \
  -destination 'generic/platform=iOS' \
  -archivePath "$out/AllAboutOlaf.xcarchive" \
  CODE_SIGN_IDENTITY="" \
  CODE_SIGNING_REQUIRED=NO \
  CODE_SIGNING_ALLOWED=NO \
  2>&1 | xcbeautify
APP_SIZE_SHA="${APP_SIZE_SHA:-$(git rev-parse HEAD)}" \
  node scripts/pr-report/app-size.mjs "$out/AllAboutOlaf.xcarchive" "$out/app-size.json"
"""

# --- Agent tasks ---

[tasks."agent:setup"]
description = "Set up the development environment for AI agents"
depends = ["pnpm:install:frozen", "bundle-data"]

[tasks."agent:pre-commit"]
description = "Run pre-commit checks: format, lint, typecheck, test, deps, lockfile"
depends = [
	"format",
	"lint",
	"tsc",
	"test",
	"validate-catalog-refs",
	"validate-deps",
	"validate-expo-versions",
	"validate-lockfile",
	"validate-mise-lock",
	"validate-single-copy",
]
