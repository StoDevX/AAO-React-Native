ignoreWorkspaceRootCheck: true
packages:
  - './'
  - 'modules/*'

# don't run install scripts at all -- CocoaPods handles native builds, and
# patchedDependencies below covers the patches this repo carries.
ignoreScripts: true

# auto-install missing peers, but fail the install on a version mismatch --
# a mismatched peer (as opposed to a merely-missing one) means two packages
# disagree about a dependency's API, which is exactly the kind of native/C++
# ABI break that tsc, oxlint, and Jest can't see (react-native-worklets 0.12.x
# renamed a method expo-modules-core's native bridge still called, and the
# only warning was this peer mismatch, silently ignored under warn-only mode)
autoInstallPeers: true
strictPeerDependencies: true
# set peer dependency suffixes to use version-only identifiers (name@version) instead of full dep paths
dedupePeers: true

# pre-existing, individually-reviewed peer mismatches that strictPeerDependencies
# would otherwise fail the install on -- each is a case where the declared range
# is stale tooling metadata, not a real incompatibility
peerDependencyRules:
  allowedVersions:
    # ts-jest, @typescript-eslint/*, and @tanstack/eslint-plugin-query all
    # declare narrower typescript ranges than this repo's actual 7.0.2; all
    # three run fine against it in practice (tsc/oxlint/Jest all pass)
    typescript: '7.0.2'

publicHoistPattern:
  - expo-module-scripts
  # metro.config.js needs mergeConfig, which @expo/metro-config does not
  # re-export. Declaring metro-config directly means pinning a version, and
  # the pin then drifts from the metro @expo/metro resolves -- which is the
  # metro that actually bundles the app. Hoisting takes whichever one Expo
  # brought instead, so the two cannot disagree.
  - metro-config

# theoretically, this configures pnpm to avoid installing optionalDependencies for
# systems other than the current one
supportedArchitectures:
  os: [current]
  cpu: [current]

# we use mise to manage the pnpm version
updateNotifier: false

# mise manages the pnpm version, so skip pnpm's own devEngines.packageManager
pmOnFail: ignore

# resolutionMode=highest roughly matches npm's behavior, which is what this
# lockfile was migrated from
resolutionMode: highest

# runs in a sh-compatible shell to avoid shell issues across the ubuntu/macOS CI matrix
shellEmulator: true

# When set to no-downgrade, pnpm will fail installation if a package's trust
# level has decreased compared to previous releases — for example, if it was
# previously published by a trusted publisher but now only has provenance or no
# trust evidence.
trustPolicy: no-downgrade
# ignore the trust check for versions that were published more than 6 months ago (arbitrary)
trustPolicyIgnoreAfter: 259200 # 6 months, in minutes

# prevent pnpm from considering new package versions for 3 days, to allow the
# ecosystem time to find and fix issues. Matches renovate.json's
# security:minimumReleaseAgeNpm preset, so both tools apply the same gate.
minimumReleaseAge: 4320 # 3 days, in minutes

# already-pinned versions from the Expo SDK 57 release train, published days
# apart from each other; excluded so the npm->pnpm migration can reproduce the
# existing, already-shipped lockfile instead of waiting the gate out.
# remove after 2026-08-10, once they clear the 3-day window on their own
minimumReleaseAgeExclude: []

catalog:
  js-yaml: '5.4.1'
  # Every module declares these two as caret peers, and autoInstallPeers turns
  # each declaration into a real install. A range that still matches the
  # version being left behind keeps its old resolution when the root pin moves,
  # so the tree ends up with two runtimes -- upward unless every module range
  # moves too, and downward always. Naming the version once removes the
  # question.
  react: '19.2.3'
  react-native: '0.86.3'

# dependency version overrides (used to live in package.json)
overrides:
  # Nothing uses this package; we use Expo's version, instead. This is
  # dragged in by react-native itself.
  # react-native asks for these three itself and floats past the metro that
  # @expo/metro pins. Expo's metro is the one that bundles the app, and
  # metro-runtime ends up inside that bundle, so these follow Expo rather than
  # react-native.
  'metro-runtime@': '0.84.5'
  'metro-source-map@': '0.84.5'
  'metro-symbolicate@': '0.84.5'
  '@react-native/metro-config': '-'
  '@react-native/community-cli-plugin': '-'
  'brace-expansion@1': '1.1.18'
  'brace-expansion@2': '2.1.4'
  'brace-expansion@5': '5.0.9'
  'postcss@': '8.5.28'
  # Known-vulnerable transitive deps, all pulled in by build/CLI tooling
  # (never part of the shipped JS bundle). Each override is scoped to the
  # currently-resolved major/minor so it can't clobber some other, unrelated
  # future resolution of the same package (e.g. a hypothetical xmldom 0.10.x
  # getting forced back down to 0.9.x).
  # -----
  # shell-quote@1.8.3 (via react-devtools-core, a react-native dependency):
  # critical newline-escaping bug (GHSA-w7jw-789q-3m8p) and a ReDoS in
  # parse() (GHSA-395f-4hp3-45gv). No fix within 1.8.x; next fixed release is 1.10.0.
  'shell-quote@': '1.10.0'
  # fast-uri@3.1.0 (via ajv, used by our own eslint/ajv-formats devDeps):
  # path-traversal and host-confusion advisories (GHSA-q3j6-qgpj-74h6,
  # GHSA-v39h-62p7-jpjc); fixed within the same 3.1.x line.
  'fast-uri@3.1': '4.1.4'
  # js-yaml@3.14.2 (via @istanbuljs/load-nyc-config, Jest's coverage
  # instrumentation): quadratic-CPU merge-key bug (GHSA-52cp-r559-cp3m) and
  # a prototype-adjacent parsing issue (GHSA-h67p-54hq-rp68). No fix within
  # 3.14.x; next fixed release is 3.15.1. (js-yaml@4.x is also a direct
  # devDependency, already bumped to a patched version in package.json.)
  'js-yaml@3': 'catalog:'
  'js-yaml@4': 'catalog:' # just throw v4 in here as well
  # @babel/core resolves twice: our own devDependency (already bumped in
  # package.json) and a separate transitive instance pulled in via Jest's
  # babel-jest/istanbul instrumentation chain, which independently pinned
  # 7.29.0 -- ReDoS in template literal parsing (GHSA-4x5r-pxfx-6jf8).
  '@babel/core@': '7.29.7'
  # react-dom is an optionalDependency of expo, @expo/ui, and @expo/router-server
  # -- all needed only for their web targets. This app is iOS-only and never
  # renders any of their web variants, so drop it rather than just pinning it.
  'react-dom': '-'
  # vaul is a react-dom drawer component @expo/ui only needs for its web
  # target; this app is iOS-only and never renders @expo/ui's web variant.
  # Pinned to the major version so an @expo/ui SDK bump forces a re-check
  # that vaul is still unused before silently dropping it again.
  '@expo/ui@57>vaul': '-'
  # @sentry/cli is a dependency of both @sentry/react-native and
  # @sentry/expo-upload-sourcemaps, but neither is wired into a build phase
  # here: the Xcode "Bundle React Native code and images" step runs plain
  # react-native-xcode.sh, not Sentry's wrapper, and nothing uploads
  # sourcemaps at all. Drop it -- it's dead weight that costs every install a
  # platform-specific CLI binary download for nothing.
  '@sentry/cli': '-'

# bind top-level dependencies to exact versions, so lockfile-maintenance MRs
# can't bump them without us noticing
saveExact: true
savePrefix: ''
patchedDependencies:
  '@expo/ui@57.0.14': patches/@expo__ui@57.0.14.patch
  react-native-change-icon@5.0.0: patches/react-native-change-icon@5.0.0.patch
  react-native@0.86.3: patches/react-native@0.86.3.patch
