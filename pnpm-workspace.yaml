  expo-router>vaul: '-'
  react-native>@react-native/community-cli-plugin: '-'

packageExtensions:
  '@expo/log-box@55':
    peerDependenciesMeta:
      react-dom:
        optional: true
      react-native-web:
        optional: true

shellEmulator: true

strictDepBuilds: true

strictPeerDependencies: true
