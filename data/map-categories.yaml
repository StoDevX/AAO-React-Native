stolaf:
  groups:
    - label: Buildings
      categories: [building]
      icon: building.2.fill
      gradient: gray
    - label: Academic
      categories: [academic]
      icon: graduationcap.fill
      gradient: gold
    - label: Dining
      categories: [dining]
      icon: fork.knife
      gradient: orange
    - label: Housing
      categories: [residence-hall, housing]
      icon: bed.double.fill
      gradient: indigo
    - label: Offices
      categories: [administrative, admissions]
      icon: briefcase.fill
      gradient: blue
    - label: Athletics
      categories: [athletics, field]
      icon: figure.run
      gradient: red
    - label: Outdoors
      categories: [outdoors]
      icon: tree.fill
      gradient: green
    - label: Wellness Walks
      categories: [wellness-walk]
      icon: figure.walk
      gradient: mint
    - label: Parking
      categories: [parking, campus-parking, accessible-parking, visitor-parking, admissions-parking]
      icon: parkingsign
      gradient: light-blue
    - label: Landmarks
      categories: [landmark, memorial]
      icon: building.columns.fill
      gradient: tan
    - label: Services
      categories: [bookstore, student-center, visitor-center, visitor-information, ev-charging]
      icon: info.circle.fill
      gradient: purple

  # The icon a place's row draws: the first entry sharing any of the place's
  # categories. Most specific first -- a walk before a trail, a field before
  # the outdoors, anything before a plain building.
  icons:
    - {categories: [wellness-walk], icon: figure.walk, gradient: mint}
    - {categories: [trail], icon: figure.hiking, gradient: green}
    - {categories: [water], icon: water.waves, gradient: blue}
    - {categories: [athletics, field], icon: figure.run, gradient: red}
    - {categories: [accessible-parking], icon: figure.roll, gradient: light-blue}
    - {categories: [parking], icon: parkingsign, gradient: light-blue}
    - {categories: [dining], icon: fork.knife, gradient: orange}
    - {categories: [residence-hall, housing], icon: bed.double.fill, gradient: indigo}
    - {categories: [academic], icon: graduationcap.fill, gradient: gold}
    - {categories: [administrative, admissions], icon: briefcase.fill, gradient: blue}
    - {categories: [landmark, memorial], icon: building.columns.fill, gradient: tan}
    - categories: [bookstore, student-center, visitor-center, visitor-information, ev-charging]
      icon: info.circle.fill
      gradient: purple
    - {categories: [outdoors], icon: tree.fill, gradient: green}
    - {categories: [building], icon: building.2.fill, gradient: gray}

carleton:
  groups:
    - label: Buildings
      categories: [building]
      icon: building.2.fill
      gradient: gray
    - label: Academic
      categories: [academic]
      icon: graduationcap.fill
      gradient: gold
    - label: Housing
      categories: [student-housing, hall, house, employee-housing]
      icon: bed.double.fill
      gradient: indigo
    - label: Offices
      categories: [administrative]
      icon: briefcase.fill
      gradient: blue
    - label: Athletics
      categories: [athletics]
      icon: figure.run
      gradient: red
    - label: Outdoors
      categories: [outdoors]
      icon: tree.fill
      gradient: green
    - label: Parking
      categories: [parking]
      icon: parkingsign
      gradient: light-blue
  # As St. Olaf's. `hall` and `house` are left out of housing: Carleton uses
  # them for its academic and office buildings too.
  icons:
    - {categories: [athletics], icon: figure.run, gradient: red}
    - {categories: [parking], icon: parkingsign, gradient: light-blue}
    - {categories: [student-housing, employee-housing], icon: bed.double.fill, gradient: indigo}
    - {categories: [academic], icon: graduationcap.fill, gradient: gold}
    - {categories: [administrative], icon: briefcase.fill, gradient: blue}
    - {categories: [outdoors], icon: tree.fill, gradient: green}
    - {categories: [building], icon: building.2.fill, gradient: gray}
