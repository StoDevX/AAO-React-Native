synopsis: Anyone who would rather report anonymously a known or suspected policy violation or unlawful activity can do so through Lighthouse Anonymous Reporting, a hotline run by an independent organization. Unless given permission, Lighthouse will not share with St. Olaf who made a report.
text: |
  Anyone who would rather report anonymously a known or suspected policy violation or unlawful activity can do so through Lighthouse Anonymous Reporting, a hotline run by an independent organization.

  Unless given permission, Lighthouse will not share with St. Olaf who made a report.

  You can also call Lighthouse at [866-943-5787](tel:8669435787).
