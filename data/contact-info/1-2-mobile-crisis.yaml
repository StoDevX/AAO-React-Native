synopsis: The South Central Mobile Crisis Team is available 24/7 for mental health crisis assessment and management. Call to talk through what is happening; if needed, the team can send two members to meet you where you are.
text: |
  The [South Central Mobile Crisis Team][crisis] is available 24/7 for mental health crisis assessment and management, including in Rice County.

  Call to talk through what is happening. If needed, the team can send two members to meet you where you are.

  [crisis]: https://www.horizonhomes.org/south-central-mobile-crisis-team/ "South Central Mobile Crisis Team"
