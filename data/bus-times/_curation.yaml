# Permanent editorial data the GTFS feed cannot supply: which routes we
# publish, what we call their stops, and the prose and colours around them.
# Expected to grow slowly and live forever -- unlike _repairs.yaml, which
# patches feed bugs and is meant to be deleted.

# The feed names stops for dispatchers; these are the names riders read.
# Applied to every route.
stop_names:
  'St Olaf College': St. Olaf College
  'Library Nf': Library
  'Food Co-Op': Food Co-op
  'Target Cub': Cub/Target
  'Well Fargo ( Transit Shelter)': Wells Fargo
  'South Oak': South Oak Apartments
  'City Hall': City Hall on Washington

routes:
  # Keyed by GTFS route_id. `expect_name` is not used to match -- it is
  # recorded so the generator can warn when Trillium renames a route under a
  # stable id, which would otherwise pass silently.
  #
  # `file` carries a numeric prefix (`bundle-data-dir.mjs` sorts by it to
  # order the lines in the app) that a human assigns, not the generator --
  # it is written out literally here rather than derived from `line` or
  # `route_id` so a future reader does not go looking for where the
  # generator computes display order.
  '77627':
    expect_name: Blue - Northfield
    file: 4-blue-line.yaml
    line: Blue Line
    colors:
      bar: rgb(103, 153, 170)
      dot: rgb(13, 26, 35)
    notice: Route that services the north part of the city. Normal route service is $1.25.

  '77628':
    expect_name: Red - Northfield
    file: 3-red-line.yaml
    line: Red Line
    colors:
      bar: rgb(233, 87, 95)
      dot: rgb(151, 27, 16)
    notice: Route that services the south part of the city. Oles ride free with a student ID.

  '77629':
    expect_name: Express Northfield
    file: 1-express.yaml
    line: Express Bus
    colors:
      bar: rgb(134, 198, 124)
      dot: rgb(32, 87, 14)
    notice: Route that services the majority of the city limits. Normal route service is free with a St. Olaf ID.
