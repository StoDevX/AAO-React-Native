# Patches for bugs in the upstream GTFS feed. Each entry records the
# feed_version it was written against; the generator warns when the feed has
# moved past that version, so a repair cannot quietly outlive its bug.
#
# These are meant to be deleted. Permanent editorial data belongs in
# _curation.yaml instead.

repairs:
  - id: agency-timezone
    reason: >-
      agency.txt says America/Los_Angeles. Northfield is Central. The feed
      knows this itself -- every stop in stops.txt carries stop_timezone
      America/Chicago -- so only the agency-level field is wrong.
    written_against: 'UTC: 10-Dec-2025 15:23'
    expires: 2027-01-01
    set:
      timezone: America/Chicago

  - id: express-service-window
    reason: >-
      The three Express service_ids in calendar.txt all ended 2026-06-08, so
      the feed says the Express does not run at all. The 8/1/2026 brochure
      says Monday-Saturday, 3:00pm-10:00pm during the Carleton and St. Olaf
      school year. Drop this once Trillium publishes a feed covering the
      current term.
    written_against: 'UTC: 10-Dec-2025 15:23'
    expires: 2027-01-01
    route: '77629'
    set:
      days: [Mo, Tu, We, Th, Fr, Sa]
