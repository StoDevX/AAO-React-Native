# The Student Work landing screen's tiles, in the order it draws them, and
# the St. Olaf unit numbers whose job postings belong to each. A posting is in
# an area when a keyword search for one of the area's units finds it; a unit
# listed nowhere here leaves its postings under "All job postings" only.
#
# Each unit is written with its name from the work-authorisation list, for
# whoever edits this file next:
# https://www.stolaf.edu/apps/workauth/Autocomplete.cfc?method=setLawsonUnitsAccountNumber&returnformat=json
# 22005 and 24200 are not on that list; their names come from their postings.

