# Official 2026–27 Registrar academic calendar, revised 2026-08-11.
# https://wp.stolaf.edu/registrar/files/2026/08/2026-27-Academic-Calendar-FINAL-8.11.26.pdf
# Verified 2026-10-04; boundaries are inclusive dates in America/Chicago.
# Academic dates establish calendar context only, not operating hours.
# weekOne retains the orientation identifier; weekZero has no verified boundary.
# Summer is omitted until operating boundaries are established.
timezone: America/Chicago
templates:
  library-fall-closed:
    # https://wp.stolaf.edu/current-students/breaks/ (2026–27, checked 2026-10-04)
    # Rolvaag and Music Library both explicitly close October 10–13, 2026.
    - title: Fall Break
      isPhysicallyOpen: false
      hours: []
      notes: Closed for Fall Break.
breaks:
  weekOne:
    name: New Student Orientation
    start: '2026-09-04'
    end: '2026-09-09'
  fall:
    name: Fall Break
    start: '2026-10-10'
    end: '2026-10-13'
  thanksgiving:
    name: Thanksgiving Break
    start: '2026-11-25'
    end: '2026-11-29'
  christmasfest:
    name: Christmas Fest
    start: '2026-12-04'
    end: '2026-12-05'
  winter:
    name: Winter Break
    start: '2026-12-23'
    end: '2027-01-03'
  interim:
    name: January Term Break
    start: '2027-01-30'
    end: '2027-02-09'
  spring:
    name: Spring Break
    start: '2027-03-26'
    end: '2027-04-04'
  easter:
    name: Easter
    date: '2027-03-28'
