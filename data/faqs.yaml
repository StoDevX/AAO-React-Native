legacyText: |-
  # Support
  Say hello to us at [allaboutolaf@frogpond.tech](mailto:allaboutolaf@frogpond.tech).

  # Known Issues
  - Login Unavailable: SIS now requires Google sign-in, which the All About Olaf app can't currently support. This means login and balances are unavailable until further notice.
  - Building Hours: It reports the 2am buildings as open too often; for instance, the Pause is open on Saturday at 2am, continuing from Friday, but the app reports it as being open on Friday at 2am, as well. This is incorrect.

faqs:
  - id: support
    question: 'Say hello to us'
    answer: 'Email us at [allaboutolaf@frogpond.tech](mailto:allaboutolaf@frogpond.tech).'
    bannerTitle: Say hello to us
    bannerText: 'Email us at [allaboutolaf@frogpond.tech](mailto:allaboutolaf@frogpond.tech).'
    targets:
      - 'Faq'
    severity: alert
    icon: envelope.circle
    dismissable: false
    conditions: {institution: stolaf}
    updatedAt: '2025-12-14T00:00:00Z'

  - id: sis-login-disabled
    question: "Why can't I log in and see my balances?"
    answer: |-
      Unavailable until further notice.

      Balances login now appears to require Google sign-in on St. Olaf's end, which the All About Olaf app can't currently access or support.

      We'll update this if this changes.
    bannerTitle: Login and Balances Unavailable
    bannerText: Balances login now appears to require Google sign-in on St. Olaf's end, which the All About Olaf app can't currently access or support.
    targets:
      - Balances
      # the same screen, under its name in app versions already installed
      - SIS
    severity: alert
    icon: exclamationmark.circle
    backgroundColor: '#fef3f2'
    foregroundColor: '#b42318'
    dismissable: false
    conditions: {institution: stolaf}
    updatedAt: '2025-12-14T00:00:00Z'

  # CARLS' notices, carried over from the CARLS app's own FAQ page. The known
  # issues it listed were that app's bugs, so they stay behind.
  #
  # A build older than the institution condition drops it and would show a
  # CARLS notice to St. Olaf, so each also needs 2.9.0-rc.4 or later, which no
  # App Store build is. Older builds read only the version range, and fail it.
  - id: carls-support
    question: 'Say hello to us'
    answer: |-
      **CARLS is a work in progress!**

      If it doesn't do something you'd like it to do, or if you have a question or a problem with it, email us at [carls@frogpond.tech](mailto:carls@frogpond.tech). Thanks!
    bannerTitle: Say hello to us
    bannerText: 'Email us at [carls@frogpond.tech](mailto:carls@frogpond.tech).'
    targets:
      - 'Faq'
    severity: alert
    icon: envelope.circle
    dismissable: false
    conditions: {and: [{institution: carleton}, {versionRange: '>=2.9.0-rc.4'}]}
    updatedAt: '2026-10-08T00:00:00Z'
