# data/bus-times/_repairs.yaml, which scripts/gtfs-to-bus-times.mjs reads.
# Named with a leading `_` so validate-data leaves it to the data editor.
$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [repairs]
properties:
  repairs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, reason, written_against, set]
      properties:
        id: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        # the feed_version the repair was written for; a newer feed warns
        written_against: {type: string, minLength: 1}
        expires: {type: string, format: date}
        # a GTFS route_id; with none, the repair applies to every route
        route: {type: string, minLength: 1}
        # HANDLED_REPAIR_KEYS in gtfs-to-bus-times.mjs
        set:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            days:
              type: array
              minItems: 1
              items: {enum: [Mo, Tu, We, Th, Fr, Sa, Su]}
