$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [line, timezone, schedules, colors]
properties:
  line: {type: string, title: Line}
  timezone: {type: string, title: Timezone}
  colors: {$ref: '#/definitions/colors', title: Colors}
  notice: {type: string, title: Notice, editor: multiline}
  hidden: {type: boolean, title: Hidden}
  schedules:
    type: array
    items: {$ref: '#/definitions/schedule'}
    minItems: 1
    title: Schedules

definitions:
  schedule:
    type: object
    additionalProperties: false
    required: [days, stops, times]
    properties:
      days: {$ref: '_defs.json#/definitions/days-of-week', title: Days}
      coordinates: {$ref: '#/definitions/coordinates', title: Coordinates}
      stops: {$ref: '#/definitions/stops', title: Stops}
      times: {$ref: '#/definitions/times', title: Times}
      closures: {$ref: '#/definitions/closures', title: Closures}

  coordinates:
    type: object
    additionalProperties: {$ref: '#/definitions/coord-pair'}

  stops:
    type: array
    items: {type: string}

  times:
    type: array
    items:
      type: array
      items: {$ref: '#/definitions/time-value'}

  time-value:
    oneOf:
      - {$ref: '_defs.json#/definitions/time'}
      - {const: false}

  closures:
    type: array
    items: {$ref: '#/definitions/closure'}

  closure:
    type: object
    additionalProperties: false
    required: [date, name]
    properties:
      date: {type: string, format: date, title: Date}
      name: {type: string, title: Name}

  coord-pair:
    type: array
    items: [{type: number}, {type: number}]
    minItems: 2
    maxItems: 2

  colors:
    type: object
    additionalProperties: false
    required: [bar, dot]
    properties:
      bar: {type: string, title: Bar}
      dot: {type: string, title: Dot}
