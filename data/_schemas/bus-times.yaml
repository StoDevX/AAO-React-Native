$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [line, timezone, schedules, colors]
properties:
  line: {type: string}
  timezone: {type: string}
  colors: {$ref: '#/definitions/colors'}
  notice: {type: string}
  hidden: {type: boolean}
  schedules:
    type: array
    items: {$ref: '#/definitions/schedule'}
    minItems: 1

definitions:
  schedule:
    type: object
    additionalProperties: false
    required: [days, stops, times]
    properties:
      days: {$ref: '_defs.json#/definitions/days-of-week'}
      coordinates: {$ref: '#/definitions/coordinates'}
      stops: {$ref: '#/definitions/stops'}
      times: {$ref: '#/definitions/times'}
      closures: {$ref: '#/definitions/closures'}

  coordinates:
    type: object
    additionalProperties: {$ref: '#/definitions/coord-pair'}

  stops:
    type: array
    items: {type: string}

  times:
    type: array
    items:
      type: array
      items: {$ref: '#/definitions/time-value'}

  time-value:
    oneOf:
      - {$ref: '_defs.json#/definitions/time'}
      - {const: false}

  closures:
    type: array
    items: {$ref: '#/definitions/closure'}

  closure:
    type: object
    additionalProperties: false
    required: [date, name]
    properties:
      date: {type: string, format: date}
      name: {type: string}

  coord-pair:
    type: array
    items: [{type: number}, {type: number}]
    minItems: 2
    maxItems: 2

  colors:
    type: object
    additionalProperties: false
    required: [bar, dot]
    properties:
      bar: {type: string}
      dot: {type: string}
