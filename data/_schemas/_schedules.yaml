$schema: http://json-schema.org/draft-07/schema#
$id: schedules.json

definitions:
  text:
    type: string
    pattern: '\S'

  date:
    type: string
    format: date
    pattern: '^\d{4}-\d{2}-\d{2}$'

  time:
    type: string
    pattern: '^(?:[1-9]|1[0-2]):[0-5]\d[ap]m$'

  hours-row:
    allOf:
      - {$ref: '_defs.json#/definitions/day'}
      - type: object
        properties:
          days: {type: array, minItems: 1, uniqueItems: true}
          from: {$ref: '#/definitions/time'}
          to: {$ref: '#/definitions/time'}

  service-block:
    type: object
    additionalProperties: false
    required: [title, hours]
    properties:
      title: {$ref: '#/definitions/text'}
      notes: {$ref: '#/definitions/text'}
      isPhysicallyOpen: {type: boolean}
      closedForChapelTime: {type: boolean}
      hours:
        type: array
        items: {$ref: '#/definitions/hours-row'}
    # Empty hours need an explicit closure or an explanation such as By appointment.
    anyOf:
      - properties:
          hours: {type: array, minItems: 1}
      - required: [isPhysicallyOpen]
        properties:
          isPhysicallyOpen: {const: false}
      - required: [notes]

  services:
    type: array
    minItems: 1
    items: {$ref: '#/definitions/service-block'}

  exception:
    type: object
    additionalProperties: false
    required: [date, schedule]
    properties:
      date: {$ref: '#/definitions/date'}
      schedule: {$ref: '#/definitions/services'}

  exceptions:
    type: array
    items: {$ref: '#/definitions/exception'}

  schedule:
    oneOf:
      - {$ref: '#/definitions/services'}
      - type: object
        additionalProperties: false
        required: [schedule]
        properties:
          schedule: {$ref: '#/definitions/services'}
          exceptions: {$ref: '#/definitions/exceptions'}

  reference-or-schedule:
    oneOf:
      - {$ref: '#/definitions/text'}
      - {$ref: '#/definitions/schedule'}

  templates:
    type: object
    propertyNames: {$ref: '#/definitions/text'}
    additionalProperties: {$ref: '#/definitions/schedule'}
