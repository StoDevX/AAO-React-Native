$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [title, buttonText, text, synopsis, category, icon, gradient]
oneOf:
  - required: [phoneNumber]
  - required: [buttonLink]
properties:
  title: {type: string}
  phoneNumber: {$ref: '_defs.json#/definitions/phone'}
  buttonText: {type: string}
  buttonLink: {type: string}
  category: {type: string}
  synopsis: {type: string}
  image: {type: string}
  text: {type: string}
  # An SF Symbol name. sf-symbols-typescript ships no runtime value -- the
  # package is one declaration file -- so nothing can check this name here.
  # A wrong one draws nothing; only a missing icon falls back.
  icon: {type: string}
  # Either a name from GRADIENT_NAMES in modules/colors/resolve-gradient.ts, or
  # an explicit [inner, outer] pair. The pair must be written in the CSS Color 4
  # display-p3 syntax: a P3 colour written as hex is syntactically valid but
  # numerically wrong -- indistinguishable in source from an sRGB colour, and
  # silently rendering less saturated than the one that was sampled. See
  # gradients.ts and modules/colors/display-p3.ts.
  gradient:
    oneOf:
      - type: string
        enum:
          - red
          - orange
          - gold
          - yellow
          - green
          - mint
          - light-blue
          - blue
          - indigo
          - purple
          - violet
          - pink
          - gray
          - sage
          - tan
          - pale-gold
      - type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
          pattern: '^color\(display-p3 [0-9.]+ [0-9.]+ [0-9.]+\)$'
