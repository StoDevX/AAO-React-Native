$schema: http://json-schema.org/draft-07/schema#

definitions:
  sense:
    type: object
    additionalProperties: false
    required: [definition]
    properties:
      # How the word is used here -- "with object", "no object".
      grammar: {type: string}
      definition: {type: string}
      # Citations, shown run-on after the definition.
      examples:
        type: array
        minItems: 1
        items: {type: string}
      # Senses under this one, drawn against a bullet rather than a number.
      subsenses:
        type: array
        minItems: 1
        items: {$ref: '#/definitions/sense'}

type: object
additionalProperties: false
required: [word]
oneOf:
  - required: [definition]
  - required: [senses]
properties:
  word: {type: string}
  pronunciation: {type: string}
  partOfSpeech: {type: string}
  definition: {type: string}
  senses:
    type: array
    minItems: 1
    items: {$ref: '#/definitions/sense'}
