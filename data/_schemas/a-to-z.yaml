$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [letter, values]
properties:
  letter: {type: string, title: Letter}
  values:
    type: array
    items: {$ref: '#/definitions/item'}
    title: Values

definitions:
  item:
    type: object
    additionalProperties: false
    required: [label, url]
    properties:
      label: {type: string, title: Label}
      url: {type: string, title: Link, editor: url}
