# Switches for features App Store builds may show, published separately from
# the app (see data/sources.yaml) so one can be turned off without a release.
# Each feature reads its own key; a station the radio's key leaves out is off.
$schema: http://json-schema.org/draft-07/schema#

definitions:
  switch:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled: {type: boolean, title: Enabled}

type: object
additionalProperties: false
required: [radio]
properties:
  radio:
    type: object
    title: Radio
    additionalProperties: false
    properties:
      ksto: {$ref: '#/definitions/switch', title: KSTO}
      krlx: {$ref: '#/definitions/switch', title: KRLX}
      kmnk: {$ref: '#/definitions/switch', title: KMNK}
