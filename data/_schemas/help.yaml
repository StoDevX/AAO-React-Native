$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [key, enabled, title, body]
properties:
  key: {type: string, title: Key}
  enabled: {type: boolean, title: Enabled}
  hidden: {type: boolean, title: Hidden}
  message: {type: string, title: Message}
  versionRange: {type: string, title: Version Range}
  title: {type: string, title: Title}
  body: {type: string, title: Body, editor: markdown}
  buttons:
    type: array
    items:
      # TODO: convert this to "enum" instead of "oneOf"
      oneOf:
        - $ref: '#/definitions/buttons/open-url'
        - $ref: '#/definitions/buttons/send-email'
        - $ref: '#/definitions/buttons/call-phone'
        - $ref: '#/definitions/buttons/custom'
    title: Buttons
  x-defns: {type: object, title: X Defns}

definitions:
  buttons:
    open-url:
      type: object
      additionalProperties: false
      required: [title, action, params]
      properties:
        title: {type: string, title: Title}
        action: {const: open-url, title: Action}
        enabled: {type: boolean, title: Enabled}
        params:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, format: uri, title: Link, editor: url}
          title: Params
    send-email:
      type: object
      additionalProperties: false
      required: [title, action, params]
      properties:
        title: {type: string, title: Title}
        action: {const: send-email, title: Action}
        enabled: {type: boolean, title: Enabled}
        params:
          type: object
          additionalProperties: false
          required: [to, subject, body]
          properties:
            to: {$ref: '#/definitions/setOfEmails', title: To}
            cc: {$ref: '#/definitions/setOfEmails', title: Cc}
            bcc: {$ref: '#/definitions/setOfEmails', title: Bcc}
            subject: {type: string, title: Subject}
            body: {type: string, title: Body, editor: markdown}
          title: Params
    call-phone:
      type: object
      additionalProperties: false
      required: [title, action, params]
      properties:
        title: {type: string, title: Title}
        action: {const: call-phone, title: Action}
        enabled: {type: boolean, title: Enabled}
        params:
          type: object
          additionalProperties: false
          required: [number]
          properties:
            number: {$ref: '_defs.json#/definitions/phone', title: Number}
          title: Params
    custom:
      type: object
      additionalProperties: false
      required: [title, action, params]
      properties:
        title: {type: string, title: Title}
        enabled: {type: boolean, title: Enabled}
        action: {const: custom, title: Action}
        params: {type: object, title: Params}

  setOfEmails:
    oneOf:
      - type: string
        format: email
      - type: array
        items:
          type: string
          format: email
