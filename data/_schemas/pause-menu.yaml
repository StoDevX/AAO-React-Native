$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [stationMenus, foodItems, corIcons]
properties:
  stationMenus:
    type: array
    items: {$ref: '#/definitions/menu'}
    title: Stations

  foodItems:
    type: array
    items: {$ref: '#/definitions/food-item'}
    title: Food Items

  corIcons:
    type: object
    additionalProperties: false
    title: Icons

definitions:
  menu:
    type: object
    additionalProperties: false
    required: [label]
    properties:
      label: {type: string, title: Label}
      note: {type: string, title: Note}

  food-item:
    type: object
    additionalProperties: false
    required: [label, station]
    properties:
      label: {type: string, title: Label}
      station: {type: string, title: Station}
      description: {type: string, title: Description, editor: multiline}
      special: {type: boolean, title: Special}
