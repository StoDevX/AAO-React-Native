$schema: http://json-schema.org/draft-07/schema#
$id: breaks.json

type: object
additionalProperties: false
required: [timezone, breaks]
properties:
  timezone: {$ref: 'schedules.json#/definitions/text'}
  templates: {$ref: 'schedules.json#/definitions/templates'}
  breaks:
    type: object
    propertyNames: {$ref: 'schedules.json#/definitions/text'}
    additionalProperties: {$ref: '#/definitions/break'}

definitions:
  break:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {$ref: 'schedules.json#/definitions/text'}
      date: {$ref: 'schedules.json#/definitions/date'}
      start: {$ref: 'schedules.json#/definitions/date'}
      end: {$ref: 'schedules.json#/definitions/date'}
      defaultSpaceSchedule: {$ref: 'schedules.json#/definitions/reference-or-schedule'}
      templates: {$ref: 'schedules.json#/definitions/templates'}
    oneOf:
      - required: [date]
        not:
          anyOf:
            - required: [start]
            - required: [end]
      - required: [start, end]
        not:
          required: [date]
