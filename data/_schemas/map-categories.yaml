# The category tiles the map sheet draws, and the icon each place's row
# draws, per campus. Published separately from the app (see
# data/sources.yaml) so a group can be added, renamed, reordered or restyled
# without an App Store release. A group whose
# `categories` match no place on its campus draws no tile, so an entry can
# ship ahead of the data it waits for.
$schema: http://json-schema.org/draft-07/schema#

definitions:
  group:
    type: object
    additionalProperties: false
    required: [label, categories, icon, gradient]
    properties:
      label: {type: string, minLength: 1}
      # Raw values from the campus's map/geojson `categories`. A place
      # matching any of them belongs to the group.
      categories:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      # An SF Symbol name. Nothing can check one here; a wrong name draws a
      # blank circle.
      icon: {type: string, minLength: 1}
      gradient: {$ref: '_defs.json#/definitions/gradient-name'}
  groups:
    type: array
    items: {$ref: '#/definitions/group'}
  # The icon a place's row draws: the first entry sharing any of the place's
  # categories. Most specific first, so a pond draws a drop, not the tree
  # every outdoor place shares.
  icon:
    type: object
    additionalProperties: false
    required: [categories, icon, gradient]
    properties:
      categories:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      icon: {type: string, minLength: 1}
      gradient: {$ref: '_defs.json#/definitions/gradient-name'}
  campus:
    type: object
    additionalProperties: false
    required: [groups, icons]
    properties:
      groups: {$ref: '#/definitions/groups'}
      icons:
        type: array
        items: {$ref: '#/definitions/icon'}

type: object
additionalProperties: false
required: [stolaf, carleton]
properties:
  stolaf: {$ref: '#/definitions/campus'}
  carleton: {$ref: '#/definitions/campus'}
