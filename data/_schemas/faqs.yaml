# The FAQs and the banners they raise. source/features/faqs/schema.ts is what
# the app parses them with; an item that fails it falls back to an unstyled
# notice, so this schema holds the data to what that parser accepts.
$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [faqs]
properties:
  # Shown on the FAQ screen by app versions that predate `faqs`.
  legacyText: {type: string}
  faqs:
    type: array
    items: {$ref: '#/definitions/faq'}

definitions:
  faq:
    type: object
    additionalProperties: false
    required: [id, question, answer, bannerTitle, bannerText, targets, updatedAt]
    properties:
      id: {type: string, minLength: 1}
      question: {type: string, minLength: 1}
      answer: {type: string, minLength: 1}
      bannerTitle: {type: string, minLength: 1}
      bannerText: {type: string, minLength: 1}
      bannerCta: {type: string, minLength: 1}
      # The screens whose banner shows this FAQ.
      targets:
        type: array
        items: {type: string, minLength: 1}
      severity: {enum: [notice, info, alert]}
      icon: {type: string, minLength: 1}
      backgroundColor: {type: string, minLength: 1}
      foregroundColor: {type: string, minLength: 1}
      dismissable: {type: boolean}
      # `3 days`, `12h` or an ISO 8601 duration such as `P1D`.
      repeatInterval: {type: string, minLength: 1}
      conditions:
        oneOf:
          - $ref: '#/definitions/condition'
          - type: array
            minItems: 1
            items: {$ref: '#/definitions/condition'}
      updatedAt: {type: string, format: date-time}

  condition:
    oneOf:
      - type: object
        additionalProperties: false
        required: [and]
        properties:
          and: {type: array, minItems: 1, items: {$ref: '#/definitions/condition'}}
      - type: object
        additionalProperties: false
        required: [or]
        properties:
          or: {type: array, minItems: 1, items: {$ref: '#/definitions/condition'}}
      - type: object
        additionalProperties: false
        required: [not]
        properties:
          not: {$ref: '#/definitions/condition'}
      - type: object
        additionalProperties: false
        minProperties: 1
        properties:
          platform: {$ref: '#/definitions/platform'}
          platforms: {type: array, minItems: 1, items: {$ref: '#/definitions/platform'}}
          campus: {$ref: '#/definitions/campus'}
          campuses: {type: array, minItems: 1, items: {$ref: '#/definitions/campus'}}
          versionRange: {type: string, minLength: 1}
          startDate: {type: string, format: date-time}
          endDate: {type: string, format: date-time}

  platform: {enum: [ios, android, native]}
  # CAMPUS_IDS in source/campuses/ids.ts.
  campus: {enum: [edu.stolaf, edu.carleton, example.college]}
