$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [name, category, schedule]
properties:
  name: {type: string}
  subtitle: {type: string}
  abbreviation: {type: string}
  category: {type: string}
  image: {type: string}
  building: {type: string, pattern: '^[a-z0-9-]+$'}
  isNotice: {type: boolean}
  noticeMessage: {type: string}
  links:
    type: array
    items: {$ref: '#/definitions/links'}
  schedule:
    type: array
    items: {$ref: '#/definitions/schedule'}
  breakSchedule:
    type: object
    # The break names from _schemas/breaks.yaml, plus `summer`. Constrained so a
    # key mis-indented into this block -- `building:`, say -- is rejected rather
    # than silently swallowed. `christmasfest` is listed though no building
    # currently sets hours for it: it is a real St. Olaf break, and the schema
    # should not be what stops someone recording that the library closes early
    # for it.
    propertyNames:
      enum: [fall, thanksgiving, christmasfest, winter, interim, spring, easter, summer]

definitions:
  links:
    additionalProperties: false
    required: [title, url]
    properties:
      title: {type: string}
      url: {type: string}
  schedule:
    type: object
    additionalProperties: false
    required: [title, hours]
    properties:
      title: {type: string}
      notes: {type: string}
      closedForChapelTime: {type: boolean}
      isPhysicallyOpen: {type: boolean}
      status:
        type: object
        additionalProperties: false
        required: [name]
        properties:
          symbol: {type: string}
          name: {type: string, maxLength: 12}
      hours:
        type: array
        items: {$ref: '_defs.json#/definitions/day'}
