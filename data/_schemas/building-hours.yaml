$schema: http://json-schema.org/draft-07/schema#

type: object
additionalProperties: false
required: [name, category, kind, schedule]
properties:
  name: {type: string}
  subtitle: {type: string}
  abbreviation: {type: string}
  category: {type: string}
  # What the venue is, where `category` is only how the Hours list groups it:
  # a building's own hours, an office, a space inside a building, or a service
  # with hours and no place (a hotline). A building's map card shows its
  # `building` venue.
  kind: {enum: [building, office, space, service]}
  # False keeps the venue out of the Hours list's categories. It stays
  # reachable through search and the All spaces screen. Absent means listed.
  listed: {type: boolean}
  image: {type: string}
  building: {type: string, pattern: '^[a-z0-9-]+$'}
  isNotice: {type: boolean}
  noticeMessage: {type: string}
  links:
    type: array
    items: {$ref: '#/definitions/links'}
  schedule:
    type: array
    items: {$ref: '#/definitions/schedule'}
  breakSchedule:
    type: object
    # The break names from _schemas/breaks.yaml, plus `summer`. Constrained so a
    # key mis-indented into this block -- `building:`, say -- is rejected rather
    # than silently swallowed. `christmasfest` is listed though no building
    # currently sets hours for it: it is a real St. Olaf break, and the schema
    # should not be what stops someone recording that the library closes early
    # for it.
    propertyNames:
      enum: [fall, thanksgiving, christmasfest, winter, interim, spring, easter, summer]

definitions:
  links:
    additionalProperties: false
    required: [title, url]
    properties:
      title: {type: string}
      url: {type: string}
  schedule:
    type: object
    additionalProperties: false
    required: [title, hours]
    properties:
      title: {type: string}
      notes: {type: string}
      closedForChapelTime: {type: boolean}
      isPhysicallyOpen: {type: boolean}
      hours:
        type: array
        items: {$ref: '_defs.json#/definitions/day'}
