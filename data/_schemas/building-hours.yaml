$schema: http://json-schema.org/draft-07/schema#
$id: building-hours.json

type: object
additionalProperties: false
required: [name, category, kind, schedule]
properties:
  name: {type: string}
  subtitle: {type: string}
  abbreviation: {type: string}
  category: {type: string}
  kind: {enum: [building, office, space, service]}
  listed: {type: boolean}
  image: {type: string}
  building: {type: string, pattern: '^[a-z0-9-]+$'}
  isNotice: {type: boolean}
  noticeMessage: {type: string}
  links:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [title, url]
      properties:
        title: {type: string}
        url: {type: string}
  schedule: {$ref: 'schedules.json#/definitions/services'}
  exceptions: {$ref: 'schedules.json#/definitions/exceptions'}
  # The paired calendar validator checks these keys and all references.
  breakSchedule:
    type: object
    propertyNames: {$ref: 'schedules.json#/definitions/text'}
    additionalProperties: {$ref: 'schedules.json#/definitions/reference-or-schedule'}
