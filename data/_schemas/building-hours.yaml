$schema: http://json-schema.org/draft-07/schema#
$id: building-hours.json

type: object
additionalProperties: false
required: [name, category, kind, schedule]
properties:
  name: {$ref: 'schedules.json#/definitions/text', title: Name}
  subtitle: {type: string, title: Subtitle}
  abbreviation: {type: string, title: Abbreviation}
  category: {type: string, title: Category}
  kind: {enum: [building, office, space, service], title: Kind}
  listed: {type: boolean, title: Listed}
  image: {type: string, title: Image, editor: image}
  building: {type: string, pattern: '^[a-z0-9-]+$', title: Building}
  isNotice: {type: boolean, title: Shows a Notice}
  noticeMessage: {type: string, title: Notice, editor: multiline}
  links:
    type: array
    title: Links
    items:
      type: object
      additionalProperties: false
      required: [title, url]
      title: Link
      properties:
        title: {type: string, title: Title}
        url: {type: string, title: Link, editor: url}
  schedule: {$ref: 'schedules.json#/definitions/services'}
  exceptions: {$ref: 'schedules.json#/definitions/exceptions'}
  # The paired calendar validator checks these keys and all references.
  breakSchedule:
    type: object
    propertyNames: {$ref: 'schedules.json#/definitions/text'}
    additionalProperties: {$ref: 'schedules.json#/definitions/reference-or-schedule'}
