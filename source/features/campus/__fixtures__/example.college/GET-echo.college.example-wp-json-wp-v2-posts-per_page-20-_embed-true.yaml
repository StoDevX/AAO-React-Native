      rendered: |-
        <p>Hockey on the pond returns this winter. The story broke on a cold morning in the valley, and by lunch everyone at Treeline Commons had an opinion about it.</p>
        <p>Students and staff we spoke to were mostly hopeful, if a little tired of waiting. “It has been a long time coming,” one said, stamping snow off their boots.</p>
        <p>More on this from the Slopes desk in next week’s Echo.</p>
