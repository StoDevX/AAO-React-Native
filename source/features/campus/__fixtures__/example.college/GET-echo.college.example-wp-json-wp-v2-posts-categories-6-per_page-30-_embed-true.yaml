    content:
      protected: false
      rendered: |-
        <p>The stars over the valley are clear this week. Here is what they say.</p>
        <p><strong>Aries:</strong> Someone in your seminar has the notes you missed. Ask before the snow piles up on the path. Wax your skis, or at least think about it. The valley rewards anyone who prepares a little.</p>
        <p><strong>Taurus:</strong> A friend will drag you to the pond on Friday. Go: the ice is thicker than your excuses. You will find a glove that is not yours. Return it; the owner has been cold for days.</p>
        <p><strong>Gemini:</strong> Your laundry has been waiting since Tuesday. Today it wins, and you will thank it. Volunteer for the ski patrol shift nobody wants. The sunrise from the top is worth it.</p>
        <p><strong>Cancer:</strong> The commons runs out of cocoa at nine. Arrive at eight fifty-five with a plan and a mug. Write the email you are putting off. It is three sentences long and you know all three.</p>
        <p><strong>Leo:</strong> A quiet week for you, which is a gift. Spend it on the book you keep carrying around. A long walk up the ridge clears the fog in your head better than another coffee will.</p>
        <p><strong>Virgo:</strong> Wax your skis, or at least think about it. The valley rewards anyone who prepares a little. The monkeys in the library mural are watching you study. Make them proud this week.</p>
        <p><strong>Libra:</strong> You will find a glove that is not yours. Return it; the owner has been cold for days. The first chair is yours if you set two alarms. Bring a thermos for whoever rides up with you.</p>
        <p><strong>Scorpio:</strong> Volunteer for the ski patrol shift nobody wants. The sunrise from the top is worth it. Someone in your seminar has the notes you missed. Ask before the snow piles up on the path.</p>
        <p><strong>Sagittarius:</strong> Write the email you are putting off. It is three sentences long and you know all three. A friend will drag you to the pond on Friday. Go: the ice is thicker than your excuses.</p>
        <p><strong>Capricorn:</strong> A long walk up the ridge clears the fog in your head better than another coffee will. Your laundry has been waiting since Tuesday. Today it wins, and you will thank it.</p>
        <p><strong>Aquarius:</strong> The monkeys in the library mural are watching you study. Make them proud this week. The commons runs out of cocoa at nine. Arrive at eight fifty-five with a plan and a mug.</p>
        <p><strong>Pisces:</strong> The first chair is yours if you set two alarms. Bring a thermos for whoever rides up with you. A quiet week for you, which is a gift. Spend it on the book you keep carrying around.</p>
