name: PR description

on:
  # pull_request_target so the comment can be posted on a fork's PR. Nothing
  # from the PR is checked out or run; the description only reaches the script
  # through an environment variable.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- nothing from the PR is checked out or run
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

# The newest run has the newest description, so an older run that is still
# going must not post a warning after it.
concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: Has a description
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Check the description, and comment when it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- pr-description-check -->'

          # Comments and whitespace are what a template leaves behind.
          text=$(printf '%s' "$PR_BODY" | perl -0pe 's/<!--.*?-->//gs; s/\s+//g')

          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -n 1)

          if [ -n "$text" ]; then
            if [ -n "$existing" ]; then
              gh api -X DELETE "repos/$REPO/issues/comments/$existing"
            fi
            exit 0
          fi

          body="$marker
          This pull request has no description. Add one saying what changed and why; this check passes once it does."

          if [ -z "$existing" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

          echo '::error::The pull request has no description.'
          exit 1
