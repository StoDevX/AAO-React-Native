name: Android Release

# Builds one app's signed Android App Bundle and, once the repository has a
# Play service account, uploads it to a Play track. The Release workflow starts
# a run for each app that ships when it tags a release, the tag Xcode Cloud
# builds for iOS; run it by hand for another app or another track. See
# documentation/AllAboutAnything.docc/AndroidReleases.md.
#
# Each app is its own Play listing, so one run builds one app.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: The app to build
        type: choice
        options: [aao, carls, aaa]
        default: aao
      track:
        description: The Play track to release it on
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: The release's status there; an app Play has never published takes only draft
        type: choice
        options: [completed, draft]
        default: completed

permissions: {}

# One build of an app at a time, and never one cut off halfway through an
# upload. Two apps build side by side.
concurrency:
  group: android-release-${{ inputs.variant }}
  cancel-in-progress: false

env:
  MISE_RUBY_COMPILE: 'false'
  # The sentry-cli the iOS build takes from mise ([tools.sentry] in mise.toml,
  # macOS only), which is the version @sentry/react-native pins. Change the
  # three together. The checksum is that of the release's Linux binary, which
  # npm's @sentry/cli-linux-x64 ships byte for byte.
  SENTRY_CLI_VERSION: '3.8.0'
  SENTRY_CLI_SHA256: '13f8cb34ae01a6a272d7d7c22e277a105286615b4020de900ea95a8de47cdbb6'

jobs:
  build:
    name: Build ${{ inputs.variant }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      package: ${{ steps.identity.outputs.package }}
      version: ${{ steps.identity.outputs.version }}
      version-code: ${{ steps.identity.outputs.version-code }}
    env:
      APP_VARIANT: ${{ inputs.variant }}
      # Whether to upload source maps, R8's mapping and native symbols. The
      # token itself goes only to the Gradle step that uploads.
      UPLOADS_TO_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      # Play needs each upload's version code higher than the last. The run
      # number of this workflow rises with every run, whichever app or tag it
      # builds, and a rebuild of the same tag gets a new one, which a code
      # derived from the version could not. The offset lifts it above any code
      # an app's listing already holds; set the ANDROID_VERSION_CODE_OFFSET
      # repository variable to raise it. Play's ceiling is 2100000000.
      VERSION_CODE_OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '1000000' }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        # Without it Gradle would sign with the debug key, which Play refuses
        # only after the whole build.
        run: |
          missing=()
          test -n "$KEYSTORE" || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          test -n "$STORE_PASSWORD" || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          test -n "$KEY_ALIAS" || missing+=(ANDROID_UPLOAD_KEY_ALIAS)
          test -n "$KEY_PASSWORD" || missing+=(ANDROID_UPLOAD_KEY_PASSWORD)
          if ((${#missing[@]})); then
            echo "::error::Missing secrets: ${missing[*]}. See documentation/AllAboutAnything.docc/AndroidReleases.md."
            exit 1
          fi

      # No caches: a release is built from what the lockfiles name, never from
      # a cache another branch's run could have written.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle data
        run: mise run bundle-data

      - name: Work out the version
        id: identity
        run: |
          set -euo pipefail
          config="$(pnpm exec expo config --type public --json)"
          version_code=$((VERSION_CODE_OFFSET + RUN_NUMBER))
          {
            echo "package=$(jq -r '.android.package' <<<"$config")"
            echo "version=$(jq -r '.extra.fullVersion' <<<"$config")"
            echo "version-code=$version_code"
          } >>"$GITHUB_OUTPUT"
          echo "Building $(jq -r '.android.package' <<<"$config") $(jq -r '.extra.fullVersion' <<<"$config") ($version_code)"

      # The npm sentry-cli is dropped in pnpm-workspace.yaml and mise's is
      # macOS only, so the release's own Linux binary, checked against its
      # checksum before it runs.
      - name: Install sentry-cli
        id: sentry-cli
        if: env.UPLOADS_TO_SENTRY == 'true'
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/sentry-cli"
          curl --fail --silent --show-error --location --output "$cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  $cli" | sha256sum --check --strict
          chmod +x "$cli"
          "$cli" --version
          echo "path=$cli" >>"$GITHUB_OUTPUT"

      - name: Generate the Android project
        env:
          ANDROID_VERSION_CODE: ${{ steps.identity.outputs.version-code }}
          # Written to android/sentry.properties as cli.executable; see
          # plugins/with-sentry-cli-executable.ts.
          SENTRY_CLI_BINARY: ${{ steps.sentry-cli.outputs.path }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Write the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          base64 --decode <<<"$KEYSTORE" >"$RUNNER_TEMP/upload.keystore"

      - name: Build the bundle
        working-directory: android
        env:
          # Read by android/app/build.gradle; see plugins/with-android-release-signing.ts.
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Without a token an upload would fail the build, so there is none.
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ env.UPLOADS_TO_SENTRY != 'true' }}
        # Every ABI gradle.properties lists, as Play serves each device its own.
        run: ./gradlew bundleRelease --stacktrace

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ inputs.variant }}-${{ steps.identity.outputs.version-code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  play:
    name: Upload ${{ inputs.variant }} to Play
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # Downloading this run's own artifact needs no token scope.
    permissions: {}
    env:
      PLAY_CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Skip without a Play service account
        if: env.PLAY_CONFIGURED != 'true'
        run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle stays an artifact of this run."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PLAY_CONFIGURED == 'true'
        with:
          name: android-${{ inputs.variant }}-${{ needs.build.outputs.version-code }}
          path: outputs

      # The mapping goes to Play too, so Android vitals' crash reports read as
      # source as well as Sentry's.
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        if: env.PLAY_CONFIGURED == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.build.outputs.package }}
          releaseFiles: outputs/bundle/release/app-release.aab
          mappingFile: outputs/mapping/release/mapping.txt
          releaseName: ${{ needs.build.outputs.version }} (${{ needs.build.outputs.version-code }})
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
