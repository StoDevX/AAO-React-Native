name: Check

on:
  push: {branches: [master]}
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each push to master gets its own group and is never cancelled, so every
  # master commit keeps a result. Same-group runs would otherwise supersede
  # one another.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  cache_epoch: '1'
  MISE_RUBY_COMPILE: 'false'

jobs:
  hk:
    name: hk
    runs-on: ubuntu-26.04
    env:
      # zizmor's online audits read this.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # Keyed on mise.lock alone. mise.toml also carries every task definition,
        # so editing a script invalidated a toolchain cache that had not changed --
        # three versions of this file across one stack of pull requests meant three
        # copies of the same tools. The lock pins the versions and per-platform
        # checksums, which is what `mise install` actually reads.
        #
        # A lock that disagrees with mise.toml still fails the job rather than
        # passing on a stale cache: mise-action installs with `--locked` whenever a
        # lock file is present, and that refuses any tool or version the lock does
        # not name. The install runs on every job, cache hit or not.
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: mise run bundle-data
      - run: hk check

  prettier:
    name: oxfmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: mise run format:check

  lint:
    name: lint
    runs-on: ubuntu-26.04
    env:
      # zizmor's online audits read this.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: mise run bundle-data
      - run: mise run lint

  jest:
    name: Jest
    runs-on: ubuntu-26.04
    # id-token lets the flakiness.io reporters sign in with GitHub OIDC.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: mise run test:jest -- --coverage
      # node --test ignores flags after its file globs, so the flakiness
      # reporter rides in NODE_OPTIONS rather than the mise task's arguments.
      - name: Run node:test tests
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/flakiness-node-test-reporter.mjs --test-reporter-destination=stdout
        run: mise run test:node
      # flakiness.io keeps the history; it does not gate anything.
      - name: Upload node:test results to flakiness.io
        if: always() && hashFiles('node-test-flakiness-report/report.json') != ''
        continue-on-error: true
        run: flakiness upload node-test-flakiness-report
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  tsc:
    name: TypeScript
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: mise run bundle-data
      - run: mise run tsc

  data:
    name: Data
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      # The toolchain cache is keyed on mise.lock, so a lock that has drifted
      # from mise.toml would restore a cache satisfying neither. Checked here
      # rather than left to the install: every job would fail on it, but this
      # one says which invariant broke.
      - run: mise run validate-mise-lock
      - run: mise run validate-data
      # A module that imports a @frogpond package without declaring it still
      # resolves, via the root node_modules hoist, until it doesn't.
      - run: mise run validate-deps
      # A second copy of a package that has to be singular resolves fine and
      # builds fine; only the lockfile shows it.
      - run: mise run validate-single-copy
      # One manifest naming its own react version is enough to put two copies
      # of the runtime in the tree, and only the lockfile would show it.
      - run: mise run validate-catalog-refs
      # Expo pins a version of every package it knows about, and prebuild
      # mentions one mismatch in passing. Nothing else looks, so this does --
      # against the list inside the installed SDK, so it cannot turn red
      # because Expo published something.
      - run: mise run validate-expo-versions
      # bundled.json is generated from data/sources.yaml and committed, since
      # the app needs it at build time. Fail if someone edited one and not
      # the other.
      - run: mise run bundle-data
      - run: git diff --exit-code modules/data-sources/bundled.json
      # Same bargain for renovate.json's version ceilings, which come from the
      # installed SDK's list: regenerate and fail if the commit did not.
      - run: mise run bundle-renovate-expo
      - run: git diff --exit-code renovate.json

  # Separate from the data job above because this one needs the network --
  # it fetches the live campus geojson to confirm every building: key
  # resolves. validate-data gates three workflows including deploy-data, and
  # a ccc-server blip must not block an unrelated pull request from merging.
  building-keys:
    name: Building keys
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Validate building keys
        run: |
          set +e
          mise run validate-building-keys
          status=$?
          set -e
          # Exit 2 means the geojson endpoint was unreachable -- a network
          # blip, not a bad key -- so warn instead of failing the job. Exit 1
          # means a key actually failed to resolve, which must still fail it;
          # a bad key should never pass silently just because the network
          # happened to work.
          if [ "$status" -eq 2 ]; then
            echo "::warning::Could not reach the campus geojson endpoint; building-key validation was skipped for this run."
            exit 0
          fi
          exit "$status"
