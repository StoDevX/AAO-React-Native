name: Data Editor

on:
  push: {branches: [master]}
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each push to master gets its own group and is never cancelled, so every
  # master commit keeps a result.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  xcode_version: 'Xcode_27.0'
  MISE_RUBY_COMPILE: 'false'

jobs:
  gate:
    name: Decide whether the data editor's tests must run
    runs-on: ubuntu-slim
    # The test job runs on anything but an explicit "false", so a gate that
    # fails or never starts still runs the tests.
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      # The full history, because the diff is taken against the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a pull request gets to skip. A push to master and a merge-queue
      # run always test, so a gate that is wrong is caught before it ships.
      - name: Decide
        id: gate
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          needed_line=needed=true

          if [ "$EVENT" = "pull_request" ]; then
            if git diff --name-only "$BASE...$HEAD" > changed.txt; then
              if needed_line=$(node scripts/data-editor-tests-needed.mjs changed.txt); then
                echo "$needed_line"
              else
                echo "scripts/data-editor-tests-needed.mjs failed; running the tests."
                needed_line=needed=true
              fi
            else
              echo "git diff failed; running the tests."
            fi
          fi

          echo "$needed_line" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test the data editor
    needs: [gate]
    if: always() && needs.gate.outputs.needed != 'false'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select ${{ env.xcode_version }}
        run: sudo xcode-select -s /Applications/${{ env.xcode_version }}.app

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # The parity tests run the helper under Node too, so they need its path.
      - name: Test DataEditorKit
        working-directory: macos/DataEditor/DataEditorKit
        run: DATA_EDITOR_NODE="$(mise which node)" swift test

      # The UI tests load the helper the way the app downloads it, and refuse
      # one older than the scripts it was built from.
      - name: Build the helper
        run: mise run data-editor:helper

      # The app's build stops without the oxfmt it bundles.
      - name: Build the app's runtime
        run: mise run data-editor:runtime

      - name: Generate the Xcode project
        run: mise run xcodegen

      # Signed ad hoc: the app holds no entitlements, and a runner has no
      # team certificate.
      - name: Test the app
        run: |
          TEST_RUNNER_DATA_EDITOR_NODE="$(mise which node)" xcodebuild test \
            -project macos/DataEditor/DataEditor.xcodeproj \
            -scheme DataEditor \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath data-editor-results \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=

      # The screenshots each test attaches, to see what a failed test saw.
      - name: Extract failure attachments
        if: failure()
        run: |
          mkdir -p data-editor-attachments
          xcrun xcresulttool export attachments \
            --path data-editor-results.xcresult \
            --output-path data-editor-attachments || echo "No attachments to export"

      - name: Upload failure attachments
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: data-editor-attachments
          path: data-editor-attachments/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the result bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: data-editor-results.xcresult
          path: data-editor-results.xcresult
          if-no-files-found: ignore
          retention-days: 7
