name: Android

on:
  push: {branches: [master]}
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # app.config.ts requires it; CI builds and screenshots All About Olaf.
  APP_VARIANT: 'aao'
  # Bundles the *.mock.ts data sources, so the screenshots show the same data
  # on every run rather than whatever the server has today.
  APP_MODE: mocked
  MISE_RUBY_COMPILE: 'false'
  ANDROID_PACKAGE: 'com.drewvolz.stolaf'
  ANDROID_SCHEME: 'AllAboutOlaf'

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle data
        run: mise run bundle-data

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: android
        env:
          # Source maps go to Sentry only from a release pipeline with a token.
          # The npm sentry-cli is excluded in pnpm-workspace.yaml, so an upload
          # attempted here fails the build rather than skipping.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        # One ABI, the emulator's, keeps the native build to a quarter of the
        # time. The release build type signs with the debug key until a Play
        # upload key is configured.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  android-screenshots:
    name: Android Screenshots
    needs: android-build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      # Pushes the screenshots to the android-screenshots branch, where they
      # can be read without downloading an artifact.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot every screen
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apk/app-release.apk
            scripts/android/screenshots.sh "$ANDROID_PACKAGE" "$ANDROID_SCHEME" shots

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshots
          path: shots
          retention-days: 14

      - name: Publish the screenshots to a branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # One commit per run on an orphan branch, each in a directory named for
        # the branch it screenshots, so a run never touches the source tree.
        run: |
          set -euo pipefail
          test -d shots || exit 0
          dir="${SOURCE_REF//\//-}"
          git init -q publish
          cd publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if git fetch -q --depth 1 "$remote" android-screenshots; then
            git checkout -q FETCH_HEAD
          else
            git checkout -q --orphan android-screenshots
          fi
          rm -rf "$dir"
          cp -r ../shots "$dir"
          echo "$RUN_URL" >"$dir/run.txt"
          git add -A
          git commit -q -m "Screenshots for $SOURCE_REF at ${GITHUB_SHA::7}"
          git push -q "$remote" HEAD:refs/heads/android-screenshots
