name: iOS

on:
  push: {branches: [master]}
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  xcode_version: 'Xcode_26.4'
  cache_epoch: '1'
  MISE_RUBY_COMPILE: 'false'

jobs:
  ios-bundle:
    name: iOS Bundle
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.jsbundle-cache.outputs.cache-matched-key || steps.jsbundle-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore cached jsbundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: jsbundle-cache
        # hashFiles globstars need their own path segment (dir/**/*.ext) to
        # cross directories -- dir/**.ext only matches dir's direct children,
        # so it silently skipped every file under a subdirectory (all of
        # source/features/**, app/(home)/**, etc.) and this cache almost
        # never invalidated on real JS changes.
        with:
          path: |
            ios/AllAboutOlaf/main.jsbundle
            ios/AllAboutOlaf/main.jsbundle.map
            ios/assets/
          key: jsbundle/e=${{ env.cache_epoch }}/host=ubuntu@24.04/target=ios/ref=${{ github.head_ref || github.ref_name }}/hash=${{ hashFiles('mise.toml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.json', 'babel.config.js', 'index.js', 'data/**', 'images/**', 'modules/**/*.ts', 'modules/**/*.tsx', 'source/**/*.ts', 'source/**/*.tsx', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            jsbundle/e=${{ env.cache_epoch }}/host=ubuntu@24.04/target=ios/ref=master/hash=${{ hashFiles('mise.toml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.json', 'babel.config.js', 'index.js', 'data/**', 'images/**', 'modules/**/*.ts', 'modules/**/*.tsx', 'source/**/*.ts', 'source/**/*.tsx', 'app/**/*.ts', 'app/**/*.tsx') }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
        if: steps.jsbundle-cache.outputs.cache-matched-key == ''

      - name: Install pnpm dependencies
        if: steps.jsbundle-cache.outputs.cache-matched-key == ''
        run: pnpm install --frozen-lockfile

      - name: Bundle data
        if: steps.jsbundle-cache.outputs.cache-matched-key == ''
        run: mise run bundle-data

      - name: Generate jsbundle
        if: steps.jsbundle-cache.outputs.cache-matched-key == ''
        # ios/ is generated by prebuild, which this job does not run; the
        # bundler needs its output directory to exist.
        run: |
          mkdir -p ios/AllAboutOlaf
          mise run bundle:ios
        env:
          APP_MODE: mocked

      - name: Save jsbundle to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.jsbundle-cache.outputs.cache-matched-key == ''
        with:
          path: |
            ios/AllAboutOlaf/main.jsbundle
            ios/AllAboutOlaf/main.jsbundle.map
            ios/assets/
          key: ${{ steps.jsbundle-cache.outputs.cache-primary-key }}

      # The shards read this rather than the cache. A cache entry is mutable
      # global state with a ten-gigabyte ceiling: shards queue for macOS
      # runners for half an hour or more after this job finishes, and an
      # eviction inside that window left them restoring a key that no longer
      # existed -- with fail-on-cache-miss set, a red shard that never ran a
      # test. An artifact belongs to this run and cannot be evicted out from
      # under it. The cache stays, because it is what lets this job skip the
      # bundling entirely on a later run.
      - name: Upload the jsbundle for the shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-jsbundle
          path: |
            ios/AllAboutOlaf/main.jsbundle
            ios/AllAboutOlaf/main.jsbundle.map
            ios/assets/
          retention-days: 1

  ios-cache-check:
    name: Check if iOS cache exists
    runs-on: ubuntu-24.04
    outputs:
      cache-matched-key: ${{ steps.app-cache.outputs.cache-matched-key }}
      cache-primary-key: ${{ steps.app-cache.outputs.cache-primary-key }}
      cache-key: ${{ steps.app-cache.outputs.cache-matched-key || steps.app-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cache holds what ios-build produced, so a change to how that job
      # builds has to invalidate it -- the compiler flags, the toolchain
      # selection and the build command all live here rather than in any file
      # the hash below covers, and editing them used to leave the old app in
      # place. Fingerprint the one job instead of the whole workflow, so that
      # touching Jest or Prettier doesn't throw away a twenty-minute build.
      - name: Fingerprint the build job
        id: build-job
        run: |
          set -o pipefail
          yq -o=json '.jobs.ios-build' .github/workflows/ios.yml \
            | sha256sum \
            | cut -d ' ' -f 1 \
            | sed 's/^/fingerprint=/' \
            | tee -a "$GITHUB_OUTPUT"

      # pnpm-lock.yaml belongs in this hash even though it doesn't live under
      # ios/: patched dependencies (patches/*.patch, applied by pnpm itself)
      # rewrite node_modules sources that CocoaPods copies into ios/Pods at
      # build time, so they change the compiled binary without touching any
      # tracked iOS file, and pnpm-lock.yaml records each patch's checksum.
      # Omitting it meant a patch-only change reused a cache built without it.
      # Restores rather than merely looking up, so that a hit can be republished
      # as this run's artifact below. On a miss there is nothing to download and
      # this costs nothing.
      - name: Check for cached iOS app
        id: app-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/Build/Products/
          key: ios-app/e=${{ env.cache_epoch }}/host=macOS@26/target=ios/xcode=${{ env.xcode_version }}/job=${{ steps.build-job.outputs.fingerprint }}/ref=${{ github.head_ref || github.ref_name }}/hash=${{ hashFiles('app.config.ts', 'plugins/**', 'uitests/**', 'images/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'mise.toml') }}
          restore-keys: |
            ios-app/e=${{ env.cache_epoch }}/host=macOS@26/target=ios/xcode=${{ env.xcode_version }}/job=${{ steps.build-job.outputs.fingerprint }}/ref=master/hash=${{ hashFiles('app.config.ts', 'plugins/**', 'uitests/**', 'images/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'mise.toml') }}

      # ios-build is skipped on a hit, so nothing else would publish an
      # artifact for the shards and they would be back to restoring a cache
      # entry that can be evicted in the half hour they spend queueing for a
      # macOS runner. Republishing here costs an upload on a plentiful ubuntu
      # runner and lets the shards read an artifact on every path.
      - name: Pack the cached app for the shards
        if: steps.app-cache.outputs.cache-matched-key != ''
        run: tar -C ios/build/Build/Products -cf ios-app.tar .

      - name: Republish the cached app as this run's artifact
        if: steps.app-cache.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app
          path: ios-app.tar

  ios-build:
    name: Build for iOS
    needs: [ios-cache-check]
    runs-on: macos-26
    if: needs.ios-cache-check.outputs.cache-matched-key == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select ${{ env.xcode_version }}
        run: sudo xcode-select -s /Applications/${{ env.xcode_version }}.app

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and configure ccache
        run: |
          brew install ccache
          ccache --set-config=max_size=2G
          # The wrapper React Native points CC at ends with
          # `exec $CCACHE_BINARY clang "$@"`, which reads the environment.
          # CocoaPods sets CCACHE_BINARY as an Xcode build setting, and a build
          # setting is not an environment variable at compile time -- so the
          # wrapper expands to plain `clang`, silently, and caches nothing. The
          # cache has come back empty since at least June for want of this line.
          echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"

      # The hashless restore-keys are the point rather than a fallback: ccache
      # addresses each object by its preprocessed source, compiler and flags, so
      # a directory built from neighbouring sources still answers most of the
      # compiles, and a stale entry is never wrong -- it is simply re-hashed.
      # That is also why this cache wants restoring on the runs that build from
      # scratch, which is where it pays for itself.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache/e=${{ env.cache_epoch }}/host=macOS@26/target=ios/xcode=${{ env.xcode_version }}/ref=${{ github.head_ref || github.ref_name }}/run=${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache/e=${{ env.cache_epoch }}/host=macOS@26/target=ios/xcode=${{ env.xcode_version }}/ref=${{ github.head_ref || github.ref_name }}/
            ccache/e=${{ env.cache_epoch }}/host=macOS@26/target=ios/xcode=${{ env.xcode_version }}/ref=master/

      # After the restore, not before: ccache keeps its counters inside the
      # cache directory, so zeroing them first only to restore the previous
      # run's file leaves the two runs' figures added together -- a warm run
      # that hit everything reads as 50% next to the cold run that filled it.
      - name: Zero the ccache statistics
        run: ccache --zero-stats

      - name: Generate the native project
        run: mise run prebuild
        env:
          USE_CCACHE: '1'

      # Xcode Cloud resolves Swift packages with automatic resolution off, so
      # it insists on a Package.resolved inside the .xcworkspace. That path is
      # under the generated ios/, which nothing commits, so ci_post_clone.sh
      # copies ios_scripts/Package.resolved into place -- and a copy is only
      # ever as good as the day it was taken. Resolve from scratch here and
      # compare, so a bump to @maplibre/maplibre-react-native (whose podspec
      # pins the exact MapLibre version) fails this job rather than surfacing
      # as an Xcode Cloud build that never reaches the compiler. Such a bump
      # rewrites pnpm-lock.yaml, which the iOS cache key covers, so this job
      # does run for it.
      - name: Check the committed Package.resolved is current
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/AllAboutOlaf.xcworkspace \
            -scheme AllAboutOlaf \
            -derivedDataPath ios/build
          resolved=ios/AllAboutOlaf.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if ! diff -u ios_scripts/Package.resolved "$resolved"; then
            echo "::error file=ios_scripts/Package.resolved::Stale. Refresh it with: mise run prebuild && xcodebuild -resolvePackageDependencies -workspace ios/AllAboutOlaf.xcworkspace -scheme AllAboutOlaf && cp $resolved ios_scripts/Package.resolved"
            exit 1
          fi

      - name: Build UITest bundle
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e') }}
        env:
          SKIP_BUNDLING: 'true'
          CODE_SIGNING_DISABLED: 'true'
          USE_CCACHE: '1'
        run: |
          set -o pipefail
          # NSUnbufferedIO, because xcodebuild block-buffers as soon as its
          # stdout is a pipe rather than a terminal, and xcbeautify is a pipe.
          # Without it the whole log arrives in one burst when the build ends
          # -- and a step killed at its timeout never ends, so its output is
          # lost exactly when it would say what was hanging. 2>&1 so warnings
          # and errors go through the formatter with everything else instead
          # of interleaving raw.
          NSUnbufferedIO=YES xcodebuild build-for-testing \
            -workspace ios/AllAboutOlaf.xcworkspace \
            -scheme AllAboutOlaf \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -only-testing:AllAboutOlafUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions

      # Read this to judge whether Xcode's explicit modules are bypassing the
      # ccache compiler wrapper: a hit rate near zero on a warm cache is the
      # symptom, and CLANG_ENABLE_EXPLICIT_MODULES = NO was the old remedy.
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      # Saved under a key no read will ever match, so every build writes a new
      # entry and the prefixes above restore the newest. A key that could be hit
      # cannot be written again, which suits a cache of build output but not
      # this one: ccache grows with every compile, so a stable key would freeze
      # it at whatever it held first. Ours had frozen at 19kB, written before
      # the compiler wrapper worked.
      #
      # Only master writes. Every run saving its own copy meant a ~1 GB entry
      # per branch per run, and the repository's 10 GB of cache is shared: over
      # the limit GitHub evicts the least recently used, which took out the app
      # and jsbundle caches the UITest shards restore with fail-on-cache-miss,
      # so shards went red having never run a test. A pull request still reads
      # master's cache through the ref=master prefix above, and ccache is
      # content-addressed -- a neighbouring branch's objects answer its compiles
      # just as well.
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache/e=${{ env.cache_epoch }}/host=macOS@26/target=ios/xcode=${{ env.xcode_version }}/ref=${{ github.head_ref || github.ref_name }}/run=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save iOS app to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e') }}
        with:
          path: ios/build/Build/Products/
          key: ${{ needs.ios-cache-check.outputs.cache-primary-key }}

      # Tarred, not uploaded as a tree. An artifact is a zip, and a zip does
      # not carry the executable bit or symlinks -- both of which a .app needs
      # to launch, and the frameworks inside it are symlinks. The build is
      # unsigned (CODE_SIGNING_DISABLED above), so modes and links are the
      # whole of what has to survive, and tar carries them.
      - name: Pack the app and UITest bundle
        run: tar -C ios/build/Build/Products -cf ios-app.tar .

      - name: Save iOS app as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app
          path: ios-app.tar

  uitest-gate:
    name: Decide whether UITests must run
    runs-on: ubuntu-24.04
    # uitest-plan and ios-uitest key off needs.uitest-gate.outputs.needed, not
    # this job's own result -- their job-level `if:` replaces GitHub's implicit
    # success() gate, so a failure here does not skip them. The Decide step
    # below runs with `if: always()` and defaults to needed=true before it
    # risks anything that could fail, so a failed checkout still leaves that
    # default output in place; a runner that never starts leaves the output
    # unset instead, which downstream reads the same way, since only an
    # explicit "false" skips. Either way the suite still runs. Nothing here
    # needs continue-on-error to make that true, so this job's own conclusion
    # is free to report a real failure honestly instead of masking it.
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      # The full history, because the diff is taken against the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only a pull request gets to skip. A push to master and a merge-queue run
      # always run the whole suite, so a gate that is wrong is caught before it
      # ships rather than after.
      #
      # `if: always()` so this still runs after a failed checkout, and every
      # path below ends by reporting the `needed=true` set on line one --
      # only a confident, successful "false" from the gate script overrides
      # it. A crashed step here must run the suite, not silently cancel it.
      - name: Decide
        id: gate
        if: always()
        run: |
          set -o pipefail
          needed_line=needed=true

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only \
              '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}' \
              > changed.txt
            then
              echo "Changed files:"
              cat changed.txt
              # A pull request large enough to blow past a shell's ARG_MAX would
              # make xargs invoke this once per chunk, each printing its own
              # `needed=` line -- changed.txt goes in as a path instead, so this
              # always runs the script exactly once.
              if needed_line=$(node scripts/uitests-needed.mjs changed.txt); then
                echo "$needed_line"
              else
                echo "scripts/uitests-needed.mjs failed; running the suite."
                needed_line=needed=true
              fi
            else
              echo "git diff failed; running the suite."
            fi
          fi

          echo "$needed_line" | tee -a "$GITHUB_OUTPUT"

  uitest-plan:
    name: Plan UITest shards
    runs-on: ubuntu-24.04
    needs: [uitest-gate]
    # Anything other than an explicit "false" from the gate means run it --
    # empty (the gate died before it could answer) defaults to needed, same
    # as 'true' does.
    if: |
      needs.uitest-gate.outputs.needed != 'false' &&
      !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e')
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A miss is not a failure: the planner falls back to one unit per test,
      # giving every test an equal share of the split.
      - name: Restore the UITest duration table
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: uitest-durations.json
          key: uitest-durations/e=${{ env.cache_epoch }}/ref=master/
          restore-keys: |
            uitest-durations/e=${{ env.cache_epoch }}/ref=master/

      - name: Split tests across shards
        id: split
        run: |
          echo "matrix=$(node scripts/split-uitests.mjs --test-dir uitests --shards 3 --granularity method --durations uitest-durations.json)" >> "$GITHUB_OUTPUT"

  ios-uitest:
    name: Native UITest for iOS (${{ matrix.shard }})
    needs: [uitest-gate, uitest-plan, ios-build, ios-bundle, ios-cache-check]
    runs-on: macos-26
    # A job-level `if:` replaces GitHub's implicit success()-of-needs gate, so
    # each dependency this job actually relies on is checked explicitly rather
    # than through !failure(), which would also depend on undocumented
    # behaviour of continue-on-error to keep a failed uitest-gate out of it.
    # ios-build is checked against 'failure' rather than for 'success', because
    # a cache hit skips it legitimately -- ios-cache-check republishes what the
    # cache held in that case, so ios-build not having run is not a problem.
    # Same "false" is the only skip signal as uitest-plan above -- see there
    # for why.
    if: |
      !cancelled() &&
      needs.uitest-plan.result == 'success' &&
      needs.ios-bundle.result == 'success' &&
      needs.ios-cache-check.result == 'success' &&
      needs.ios-build.result != 'failure' &&
      needs.uitest-gate.outputs.needed != 'false' &&
      !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.uitest-plan.outputs.matrix) }}
    steps:
      - run: sudo xcode-select -s /Applications/${{ env.xcode_version }}.app

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Always an artifact now: ios-build publishes what it built, and
      # ios-cache-check republishes what the cache held when the build was
      # skipped. Neither can be evicted while this job waits for a runner.
      - name: Download the iOS app and UITest bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-app

      - name: Unpack the app and UITest bundle
        run: |
          mkdir -p ios/build/Build/Products
          tar -C ios/build/Build/Products -xf ios-app.tar

      - name: Download the iOS jsbundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-jsbundle
          # The upload's three paths share ios/ as their closest common
          # ancestor, so that is the artifact's root and where it unpacks to:
          # ios/AllAboutOlaf/main.jsbundle and ios/assets/, which is the layout
          # the move below expects.
          path: ios/

      - name: Move cached jsbundle into place
        run: |
          mkdir -p ios/build/Build/Products/Debug-iphonesimulator/AllAboutOlaf.app/
          mv ios/AllAboutOlaf/main.jsbundle ios/build/Build/Products/Debug-iphonesimulator/AllAboutOlaf.app/
          mv ios/AllAboutOlaf/main.jsbundle.map ios/build/Build/Products/Debug-iphonesimulator/AllAboutOlaf.app/
          rm -rf ios/build/Build/Products/Debug-iphonesimulator/AllAboutOlaf.app/assets || true
          mv ios/assets ios/build/Build/Products/Debug-iphonesimulator/AllAboutOlaf.app/

      - name: Discover target simulator device
        id: simulator-device
        run: |
          set -o pipefail
          # Pick the latest installed iOS runtime on the runner. IPHONEOS_DEPLOYMENT_TARGET
          # is the minimum we support, not what's actually installed — on macos-26 the
          # runner ships iOS 26.x runtimes, which don't match our 18.x deployment target.
          # `simctl list runtimes` reports the full version (e.g. 26.4.1), but `simctl list
          # devices` keys runtimes as iOS-<major>-<minor> only, so strip the patch component.
          OS_VERSION=$(xcrun simctl list runtimes iOS -j | jq -r '.runtimes | map(select(.isAvailable != false)) | sort_by(.version) | last | .version | split(".") | .[0:2] | join(".")')
          echo "type=iPhone 17e" | tee -a "$GITHUB_OUTPUT"
          echo "os=${OS_VERSION//./-}" | tee -a "$GITHUB_OUTPUT"

      - name: List available simulators
        id: devices
        run: |
          set -o pipefail
          xcrun simctl list devices iOS -j \
            | jq '.devices | map_values([.[] | del(.dataPath, .dataPathSize, .logPath, .isAvailable)])' \
            | jq -r '"devices=\(.)"' \
            | tee "$GITHUB_OUTPUT"
          xcrun simctl list devices iOS

      - name: Filter simulators by OS
        id: devices-by-os
        env:
          DEVICES: '${{ steps.devices.outputs.devices }}'
          SIMULATOR_OS: '${{ steps.simulator-device.outputs.os }}'
        run: |
          set -o pipefail
          # -e makes jq exit non-zero if no runtime key matches, instead of silently
          # producing empty output and surfacing as an opaque JSON error downstream.
          jq -ern --argjson devices "$DEVICES" '$devices | to_entries[] | select(.key | endswith("iOS-\(env.SIMULATOR_OS)")) | .value | "devices=\(.)"' | tee "$GITHUB_OUTPUT"

      - name: Filter simulators by device type
        id: devices-by-os-and-type
        env:
          DEVICES: '${{ steps.devices-by-os.outputs.devices }}'
          SIMULATOR_TYPE: '${{ steps.simulator-device.outputs.type }}'
        run: |
          set -o pipefail
          jq -rn --argjson devices "$DEVICES" '$devices | .[] | select(.name == env.SIMULATOR_TYPE) | "devices=\(.)"' | tee "$GITHUB_OUTPUT"

      - name: Resolve simulator UDID
        id: udid
        env:
          DEVICES: '${{ steps.devices-by-os-and-type.outputs.devices }}'
        run: |
          set -o pipefail
          jq -rn --argjson devices "$DEVICES" '$devices | "udid=\(.udid)"' | tee "$GITHUB_OUTPUT"

      - name: Boot the simulator
        run: xcrun simctl boot "${{ steps.udid.outputs.udid }}"

      - name: Wait for the simulator to be ready
        run: xcrun simctl bootstatus "${{ steps.udid.outputs.udid }}" -b

      - name: Run UITests
        timeout-minutes: 35
        run: |
          set -o pipefail
          # Every test cold-launches the app in setUp, and on hosted runners that
          # launch sometimes outruns the 30s the screen objects allow the view tree
          # to mount, so whichever test lands on a slow moment fails. Retry rather
          # than wait longer -- a stalled launch is not a slow one, and setUp gives
          # each attempt a fresh app.
          #
          # Leave -test-repetition-relaunch-enabled off. It repeats the whole bundle
          # instead of just the failures, which would run every passing test three
          # times over and take the shard past its timeout.
          #
          # Both halves of the pipe buffer when they write to one another rather
          # than to a terminal, and each needs its own answer. NSUnbufferedIO
          # settles xcodebuild; xcbeautify holds its own output back until it
          # exits, which script(1) settles by giving the pipeline a pty to write
          # to. Without both, a shard's results land in one burst at the end --
          # and this step is killed at 25 minutes, so a hung shard never reaches
          # that burst and says nothing about what it hung on.
          #
          # script passes the command's exit status through, so a failing suite
          # still fails the step. 2>&1 sends failures through the formatter
          # rather than letting them interleave raw.
          cat > "$RUNNER_TEMP/run-uitests.sh" <<'SCRIPT'
          set -o pipefail
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -xctestrun $(find ios/build/Build/Products -name '*.xctestrun' -print -quit) \
            -destination "platform=iOS Simulator,id=${{ steps.udid.outputs.udid }}" \
            ${{ matrix.tests }} \
            -retry-tests-on-failure \
            -resultBundlePath uitest-results \
            2>&1 | xcbeautify --renderer github-actions
          SCRIPT
          script -q /dev/null bash "$RUNNER_TEMP/run-uitests.sh" < /dev/null

      # `if: always()` because the failures worth reporting are the ones that
      # ran alongside a test that stayed red.
      - name: Report flaky tests
        id: flaky
        if: always()
        run: node scripts/report-flaky-uitests.mjs uitest-results.xcresult

      # `if: always()` so a shard that went red still contributes the timings of
      # the tests that did run before it stopped.
      - name: Record test durations
        if: always()
        run: node scripts/collect-uitest-durations.mjs uitest-results.xcresult uitest-durations.json

      - name: Upload test durations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uitest-durations-${{ matrix.shard }}
          path: uitest-durations.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Extract failure attachments
        if: failure() || steps.flaky.outputs.flaky == 'true'
        run: |
          mkdir -p uitest-attachments
          xcrun xcresulttool export attachments \
            --path uitest-results.xcresult \
            --output-path uitest-attachments || echo "No attachments to export"
          screenshot_count=$(find uitest-attachments -name '*' 2>/dev/null | wc -l | tr -d ' ')
          echo "Found ${screenshot_count} attachments(s)"

      - name: Upload failure attachments
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || steps.flaky.outputs.flaky == 'true'
        with:
          name: uitest-attachments-${{ matrix.shard }}
          path: uitest-attachments/
          if-no-files-found: ignore

      - name: Upload XCResult bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || steps.flaky.outputs.flaky == 'true'
        with:
          name: uitest-results-${{ matrix.shard }}.xcresult
          path: uitest-results.xcresult/

  uitest-durations:
    name: Publish UITest durations
    needs: [ios-uitest]
    runs-on: ubuntu-24.04
    # Master alone writes. A branch reads master's table through the planner's
    # restore-key; letting every branch save one would crowd the repository's
    # shared cache and evict what the shards restore with fail-on-cache-miss.
    #
    # ios-uitest skips, rather than fails, when an upstream job (ios-build,
    # ios-bundle, uitest-plan, ios-cache-check) fails on master, and job-level
    # always() overrides GitHub's default of skipping a job whose need was
    # itself skipped. An empty table saved under this run's fresh key would
    # still outrank a good historical one on the planner's prefix restore, so
    # this only runs once ios-uitest has actually run.
    if: always() && github.ref == 'refs/heads/master' && needs.ios-uitest.result != 'skipped'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every shard's durations
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: uitest-durations-*
          path: durations/
          merge-multiple: false

      # Later shards win on a duplicate key, which is fine: a test appears in
      # exactly one shard, so there are no duplicates to arbitrate.
      - name: Merge them into one table
        id: merge
        run: |
          find durations -name uitest-durations.json -print0 \
            | xargs -0 cat \
            | jq -s 'add // {}' > uitest-durations.json
          count=$(jq 'length' uitest-durations.json)
          echo "$count tests timed"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # A run that timed nothing -- every shard skipped, or ran but recorded
      # no durations -- would still save under this run's fresh key and
      # outrank a good table on the planner's prefix restore. Skip the save
      # rather than let an empty table win.
      #
      # No explicit success() needed: a condition with no status check
      # function keeps the implicit success(), so a failed merge step skips
      # this one rather than caching whatever partial file it left behind.
      - name: Save the table for later runs
        if: steps.merge.outputs.count != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: uitest-durations.json
          key: uitest-durations/e=${{ env.cache_epoch }}/ref=master/run=${{ github.run_id }}-${{ github.run_attempt }}
