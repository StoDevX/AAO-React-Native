# example taken from https://github.com/actions/dependency-review-action

name: 'Dependency Review'
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-ghsas: >-
            GHSA-3xgq-45jj-v275,
            GHSA-2p57-rm9w-gvfp,
            GHSA-73rr-hh4g-fpgx,
            GHSA-593m-55hh-j8gv,
            GHSA-wh4c-j3r5-mjhp,
            GHSA-34x7-hfp2-rc4v,
            GHSA-8qq5-rm4j-mr97,
            GHSA-83g3-92jg-28cx,
            GHSA-qffp-2rhf-9h96,
            GHSA-9ppj-qmqm-q256,
            GHSA-r6q2-hw4h-h46w,
            GHSA-w5hq-g745-h8pq,
            GHSA-j759-j44w-7fr8,
            GHSA-x6wf-f3px-wcqx,
            GHSA-f6ww-3ggp-fr8h,
            GHSA-2v35-w6hq-6mfw
