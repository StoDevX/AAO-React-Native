name: PR report

on:
  push: {branches: [master]}
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_RUBY_COMPILE: 'false'

jobs:
  js-size:
    name: JS size
    runs-on: ubuntu-26.04
    # The merge queue has nothing to compare and no labels to read; the PR
    # passed the gate already.
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Measure the production bundle
        run: mise run size-report
        env:
          # A pull_request run checks out the merge commit; name the PR's
          # head instead, so the report says which commit it measured.
          SIZE_REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload the size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report
          path: size-report/size-report.json
          # Master's reports are every later PR's baseline.
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  # The check to require. On a pull request it compares with master and posts
  # the comment; in the merge queue it passes without measuring. `always()`
  # keeps it running when js-size fails, so the PR says why, and keeps a
  # skipped js-size from skipping it, since GitHub counts a skipped required
  # check as passing.
  report:
    name: PR report
    needs: [js-size]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Pass in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The pull request passed the size gate before it was queued."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        if: github.event_name == 'pull_request'
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
          install_args: node

      - name: Download this commit's size report
        if: github.event_name == 'pull_request' && needs.js-size.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: size-report
          path: head/

      - name: Download master's size report for the base commit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pr-report.yml \
            --branch master --event push --commit "$BASE_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No successful master run for $BASE_SHA."
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name size-report --dir baseline/ \
            || echo "Master's report for $BASE_SHA could not be downloaded."

      - name: Build the report
        id: build
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          printf '%s' "$LABELS" > labels.json
          status=0
          node scripts/pr-report/report.mjs head/size-report.json baseline/size-report.json \
            "$BASE_SHA" labels.json comment.md || status=$?
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Post the comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/pr-report/upsert-comment.sh comment.md

      - name: Size gate
        if: github.event_name == 'pull_request' && steps.build.outputs.status != '0'
        run: |
          echo "::error::The size gate failed. See the PR report comment or this job's summary."
          exit 1
