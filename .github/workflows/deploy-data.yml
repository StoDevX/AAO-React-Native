name: Validate/Deploy Data

on:
  push: {branches: [master]}

# `pages: write` and `id-token: write` are what actions/deploy-pages needs to
# claim a deployment; `contents: read` is all the rest of the job wants. The
# previous version force-pushed a branch, so it held `contents: write` against
# the whole repository to publish sixteen JSON files.
permissions:
  contents: read
  pages: write # zizmor: ignore[excessive-permissions] -- actions/deploy-pages needs it
  id-token: write # zizmor: ignore[excessive-permissions] -- actions/deploy-pages needs it

# One deployment at a time, and never cancel one that has started: a cancelled
# deploy leaves the site serving whatever the last completed run published,
# which for data the app fetches is worse than being a few minutes stale.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MISE_RUBY_COMPILE: 'false'

jobs:
  docs:
    name: Build the documentation
    uses: $/.github/workflows/docs.yml

  build:
    name: Validate and bundle the data
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # Keyed on mise.lock rather than mise.toml -- see the note in check.yml.
        with:
          cache_key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the data
        run: |
          mise run validate-bus-data
          mise run validate-data

      - name: Bundle the data
        run: mise run bundle-data

      # Pages replaces the whole site on each deploy, so the documentation
      # rides along every time. docs.yml cached it, on a Mac if it had changed.
      - name: Restore the documentation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/documentation
          key: ${{ needs.docs.outputs.cache-key }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      # Uploads docs/ as the Pages artifact. The bundle is the whole site --
      # sixteen JSON files, a stylesheet and the images, no index -- so it needs no base
      # path and no configure-pages step ahead of it.
      - name: Upload the bundle as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy the data to Pages
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
